[package]
name = "corvus-signal"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "signal-cli compatible JSON-RPC backend for corvus, built on presage"

[[bin]]
name = "corvus-signal"
path = "src/main.rs"

# Kept apart from history-store so its minimal-dependency policy is unaffected.
[dependencies]
# The corvus integration branch of presage (it uses the one of libsignal-service-rs): upstream plus
# the open pull requests corvus needs and corvus' own additions, see README.md.
presage = { git = "https://github.com/cyberneticangel/presage", rev = "61975095eac4f0a6a930da527b3e7737c9520582" }
# Custom SQLCipher crypto (not OpenSSL): the database files must not depend on
# other feature choices.
presage-store-sqlite = { git = "https://github.com/cyberneticangel/presage", rev = "61975095eac4f0a6a930da527b3e7737c9520582", features = ["sqlcipher-custom-crypto"] }

anyhow = "1.0"
base64 = "0.22"
futures = "0.3"
mime_guess = "2.0"
rand = "0.9"
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt", "io-std", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
# No default features: "ansi" (stderr is read by corvus, not a terminal) and "tracing-log" are not needed.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[features]
default = []
# Builds presage with link-preview fetching (scraper + reqwest's aws-lc provider).
# Off by default: corvus decides about previews itself and passes them with `send`.
preview = ["presage/preview"]

[dev-dependencies]
# only used to build envelope timestamps in tests
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Same patches as the presage workspace; [patch] does not propagate from dependencies.
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# unoptimized ML-KEM can stack-overflow when decrypting PQXDH prekey messages
[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
