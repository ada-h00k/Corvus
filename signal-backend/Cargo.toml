[package]
name = "corvus-signal"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "signal-cli compatible JSON-RPC backend for corvus, built on presage"

[[bin]]
name = "corvus-signal"
path = "src/main.rs"

# Kept apart from history-store so its minimal-dependency policy is unaffected.
[dependencies]
# cdsi: contact discovery, to find a phone number nobody synced (libsignal-net, BoringSSL)
presage = { git = "https://github.com/whisperfish/presage", rev = "aeaedf99babebae2dbc6b86bca797807d4cd9fda", features = ["cdsi"] }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "aeaedf99babebae2dbc6b86bca797807d4cd9fda", features = ["cdsi"] }

anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
mime_guess = "2.0"
rand = "0.9"
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt", "macros", "io-std", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# corvus integration branches of presage and libsignal-service: upstream plus the open pull
# requests corvus needs (groups, link previews off, storage service, identities) and corvus' own
# additions. Local checkouts for now, see signal-backend/README.md.
[patch."https://github.com/whisperfish/presage"]
presage = { path = "../../presage-corvus/presage" }
presage-store-sqlite = { path = "../../presage-corvus/presage-store-sqlite" }

# Same patches as the presage workspace; [patch] does not propagate from dependencies.
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# unoptimized ML-KEM can stack-overflow when decrypting PQXDH prekey messages
[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
