[package]
name = "history-store"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Encrypted chat-history store for corvus (C ABI)"

[lib]
name = "history_store"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.11"
argon2 = "0.6"
getrandom = "0.4"
zeroize = "1"

# Crypto is unusably slow at opt-level 0, also for `cargo test`.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
