app-id: io.github.ada_h00k.Corvus
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21
command: corvus

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dbash_completion=disabled
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/GNOME/libsecret.git
        tag: 0.21.8
        commit: 257547ed7a541fc63400f91578216d3b53721c57
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+\.\d+)$

  - name: qtkeychain
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TEST_APPLICATION=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /lib/*.so
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        tag: 0.17.0
        commit: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+\.\d+)$

  - name: libqrencode
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=OFF
      - -DWITH_TOOLS=ON
      - -DWITH_TESTS=OFF
    cleanup:
      - /include
      - /lib
      - /share/man
    sources:
      - type: git
        url: https://github.com/fukuchi/libqrencode.git
        tag: v4.1.1
        commit: 715e29fd4cd71b6e452ae0f4e36d917b43122ce8
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$

  - name: protobuf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -Dprotobuf_BUILD_TESTS=OFF
      - -Dprotobuf_BUILD_SHARED_LIBS=ON
      - -Dprotobuf_ABSL_PROVIDER=module
    cleanup:
      - /bin/protoc*
      - /include/google
      - /include/absl
      - /lib/libprotobuf*
      - /lib/libprotoc*
      - /lib/libabsl*
      - /lib/cmake/protobuf
      - /lib/cmake/absl
      - /lib/pkgconfig/protobuf*.pc
      - /lib/pkgconfig/absl*.pc
    sources:
      - type: git
        url: https://github.com/protocolbuffers/protobuf.git
        tag: v36.2
        commit: 2c74169b34066ceb8ddb6b882fcb3fb32d737a55
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$

  - name: hunspell
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-ui
      - --without-readline
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /lib/*.la
      - /share/man
    sources:
      - type: archive
        url: https://github.com/hunspell/hunspell/releases/download/v1.7.2/hunspell-1.7.2.tar.gz
        sha256: 11ddfa39afe28c28539fe65fc4f1592d410c1e9b6dd7d8a91ca25d85e9ec65b8

  - name: hunspell-dictionaries
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/hunspell *.aff *.dic
      - install -Dm644 -t /app/share/licenses/io.github.ada_h00k.Corvus/dictionaries README_*.txt
