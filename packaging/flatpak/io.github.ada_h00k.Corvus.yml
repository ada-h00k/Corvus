# Flatpak manifest for Corvus.
#
# Build (from the repository root):
#   python3 flatpak-cargo-generator.py history-store/Cargo.lock \
#       -o packaging/flatpak/cargo-sources.json   # flatpak-builder-tools/cargo
#   curl -fsSL -o packaging/flatpak/corvus-cli-Cargo.lock \
#       https://raw.githubusercontent.com/ada-h00k/corvus-cli/<pinned commit>/Cargo.lock
#   python3 flatpak-cargo-generator.py packaging/flatpak/corvus-cli-Cargo.lock \
#       -o packaging/flatpak/corvus-cli-cargo-sources.json
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#       flatpak-build packaging/flatpak/io.github.ada_h00k.Corvus.yml
# The release workflow does exactly that (job "flatpak").
#
# Permissions are kept to the minimum the app really needs; every entry in
# finish-args below has a reason. The KDE runtime adds a few defaults on top
# (read-only xdg-config/kdeglobals and the KDE settings bus names) so that Qt
# follows the Plasma colour scheme; nothing else. There is deliberately no
# --filesystem access to user data: files are chosen through the portal file
# chooser and the app's data lives in ~/.var/app/io.github.ada_h00k.Corvus.
# The only --filesystem entry is the read-only PipeWire socket below, which
# grants no user data either.
app-id: io.github.ada_h00k.Corvus
# Flathub currently publishes org.kde.Platform and org.kde.Sdk only through
# branch 6.11. Keep this on the published branch so CI can resolve both refs.
# Qt 6.12 adds Wayland XDG Document Portal drag-and-drop support; bump this
# after Flathub publishes the matching 6.12 runtime and SDK. No broad access
# to the host filesystem is required for that portal-backed transfer.
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # libclang for bindgen (boring-sys generates Rust bindings for BoringSSL at build time);
  # llvm21 is the llvm SDK extension matching the fd-sdk base of org.kde.Sdk 6.11
  - org.freedesktop.Sdk.Extension.llvm21
command: corvus

finish-args:
  # corvus-cli talks to the Signal servers; GIPHY and the update check use HTTPS too
  - --share=network
  # X11 shared memory (needed for the fallback X11 session)
  - --share=ipc
  # Wayland first, X11 only when there is no Wayland session
  - --socket=wayland
  - --socket=fallback-x11
  # the KDE SDK adds plain x11 by default, which would make fallback-x11 pointless
  - --nosocket=x11
  # notification sounds (pw-play / paplay) and audio/video attachments
  - --socket=pulseaudio
  # pw-play is a native PipeWire client and needs the raw PipeWire socket, which
  # Flatpak cannot expose via a --socket entry; the socket file from the runtime
  # dir is granted read-only instead. On hosts without PipeWire the mount is
  # simply skipped (pw-play then cannot connect, as on any PulseAudio-only host).
  - --filesystem=xdg-run/pipewire-0:ro
  # GPU rendering of the video player (QtMultimedia); drop it to force software rendering
  - --device=dri
  # desktop notifications (freedesktop.org Notifications; also used for the tray fallback)
  - --talk-name=org.freedesktop.Notifications
  # tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # History key: libsecret uses the Secret portal inside the sandbox; this is only the
  # fallback for desktops without that portal (KWallet, KeePassXC, ...)
  - --talk-name=org.freedesktop.secrets

# Video/audio codecs for QtMultimedia (attachment playback)
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg

modules:
  # Secret Service / Secret portal client library used by QtKeychain
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dbash_completion=disabled
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/GNOME/libsecret.git
        tag: 0.21.8
        commit: 257547ed7a541fc63400f91578216d3b53721c57
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+\.\d+)$

  - name: qtkeychain
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TEST_APPLICATION=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /lib/*.so
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        tag: 0.17.0
        commit: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+\.\d+)$

  # Only the qrencode command line tool (shows the QR code when linking a device)
  - name: libqrencode
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      # libqrencode 4.1.1 still declares cmake_minimum_required < 3.5, which CMake 4 rejects
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=OFF
      - -DWITH_TOOLS=ON
      - -DWITH_TESTS=OFF
    cleanup:
      - /include
      - /lib
      - /share/man
    sources:
      - type: git
        url: https://github.com/fukuchi/libqrencode.git
        tag: v4.1.1
        commit: 715e29fd4cd71b6e452ae0f4e36d917b43122ce8
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$

  # protoc compiler for corvus-cli's protobuf-based crates (spqr, libsignal-protocol,
  # libsignal-keytrans, libsignal-svrb): the SDK does not ship protoc, so it is built from
  # source (the same approach Flare uses on Flathub). The bundled abseil ("module"
  # provider) comes from protobuf's own submodule, keeping the build independent of the
  # abseil version the SDK ships. protoc only lives in the build sandbox; the cleanup
  # section removes compiler artifacts from the final app.
  - name: protobuf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -Dprotobuf_BUILD_TESTS=OFF
      - -Dprotobuf_BUILD_SHARED_LIBS=ON
      - -Dprotobuf_ABSL_PROVIDER=module
    cleanup:
      - /bin/protoc*
      - /include/google
      - /include/absl
      - /lib/libprotobuf*
      - /lib/libprotoc*
      - /lib/libabsl*
      - /lib/cmake/protobuf
      - /lib/cmake/absl
      - /lib/pkgconfig/protobuf*.pc
      - /lib/pkgconfig/absl*.pc
    sources:
      - type: git
        url: https://github.com/protocolbuffers/protobuf.git
        tag: v36.2
        commit: 2c74169b34066ceb8ddb6b882fcb3fb32d737a55
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$

  # corvus-cli (https://github.com/ada-h00k/corvus-cli): the Rust Signal backend (presage) that
  # replaces signal-cli. A single native executable without Java; it speaks signal-cli's
  # JSON-RPC, so Corvus runs it unchanged. Corvus finds it on PATH (/app/bin).
  # Built from source at the commit the release tag "commit-<sha>" points to, as Flathub
  # requires (everything built from source, no prebuilt binaries). All crates are vendored
  # in corvus-cli-cargo-sources.json, so the build stays offline; the vendoring covers
  # corvus-cli's git dependencies (presage, libsignal-service-rs, ...) and its C-based
  # crates (BoringSSL via boring, SQLite via libsqlite3-sys), compiled by their own build
  # scripts with the SDK's cmake, perl and cc; protoc comes from the protobuf module above
  # and libclang from the llvm21 SDK extension. Unlike the previous prebuilt binary this
  # builds on x86_64 and aarch64 alike, so there is no only-arches line.
  - name: corvus-cli
    buildsystem: simple
    build-options:
      # llvm21 provides libclang for bindgen (boring-sys generates Rust bindings for
      # BoringSSL); clang stays on PATH as well
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      env:
        # crates vendored by corvus-cli-cargo-sources.json (the build has no network access)
        CARGO_HOME: /run/build/corvus-cli/cargo
        CARGO_NET_OFFLINE: 'true'
        # bindgen (boring-sys) dlopens libclang from the llvm21 SDK extension
        LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    build-commands:
      - cargo build --release --offline --locked
      - install -Dm755 target/release/corvus-cli /app/bin/corvus-cli
    sources:
      - type: git
        url: https://github.com/ada-h00k/corvus-cli.git
        tag: commit-4d76022c8ff0d2e4bc42d8392c0762024dfa1db9
        commit: 4d76022c8ff0d2e4bc42d8392c0762024dfa1db9
        x-checker-data:
          type: git
          tag-pattern: ^(commit-[0-9a-f]{40})$
      # generated from corvus-cli's Cargo.lock by flatpak-cargo-generator.py
      - corvus-cli-cargo-sources.json

  - name: corvus
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        # crates vendored by cargo-sources.json (the build has no network access)
        CARGO_HOME: /run/build/corvus/cargo
        CARGO_NET_OFFLINE: 'true'
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    post-install:
      # Flatpak requires the desktop file and the icon to be named after the app ID
      - mv /app/share/applications/corvus.desktop /app/share/applications/io.github.ada_h00k.Corvus.desktop
      - sed -i 's|^Icon=.*|Icon=io.github.ada_h00k.Corvus|' /app/share/applications/io.github.ada_h00k.Corvus.desktop
      - mv /app/share/icons/hicolor/scalable/apps/corvus.svg /app/share/icons/hicolor/scalable/apps/io.github.ada_h00k.Corvus.svg
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/packaging/flatpak/io.github.ada_h00k.Corvus.metainfo.xml
        -t /app/share/metainfo
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/LICENSE -t /app/share/licenses/io.github.ada_h00k.Corvus
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
          - build
          - dist
      # generated from history-store/Cargo.lock by flatpak-cargo-generator.py
      - cargo-sources.json
