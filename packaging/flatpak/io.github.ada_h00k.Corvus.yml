# Flatpak manifest for Corvus.
#
# Build (from the repository root):
#   python3 flatpak-cargo-generator.py history-store/Cargo.lock \
#       -o packaging/flatpak/cargo-sources.json   # flatpak-builder-tools/cargo
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#       flatpak-build packaging/flatpak/io.github.ada_h00k.Corvus.yml
# The release workflow does exactly that (job "flatpak").
#
# Permissions are kept to the minimum the app really needs; every entry in
# finish-args below has a reason. The KDE runtime adds a few defaults on top
# (read-only xdg-config/kdeglobals and the KDE settings bus names) so that Qt
# follows the Plasma colour scheme; nothing else. There is deliberately no
# --filesystem access to user data: files are chosen through the portal file
# chooser and the app's data lives in ~/.var/app/io.github.ada_h00k.Corvus.
# The only --filesystem entry is the read-only PipeWire socket below, which
# grants no user data either.
app-id: io.github.ada_h00k.Corvus
# Flathub currently publishes org.kde.Platform and org.kde.Sdk only through
# branch 6.11. Keep this on the published branch so CI can resolve both refs.
# Qt 6.12 adds Wayland XDG Document Portal drag-and-drop support; bump this
# after Flathub publishes the matching 6.12 runtime and SDK. No broad access
# to the host filesystem is required for that portal-backed transfer.
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: corvus

finish-args:
  # corvus-cli talks to the Signal servers; GIPHY and the update check use HTTPS too
  - --share=network
  # X11 shared memory (needed for the fallback X11 session)
  - --share=ipc
  # Wayland first, X11 only when there is no Wayland session
  - --socket=wayland
  - --socket=fallback-x11
  # the KDE SDK adds plain x11 by default, which would make fallback-x11 pointless
  - --nosocket=x11
  # notification sounds (pw-play / paplay) and audio/video attachments
  - --socket=pulseaudio
  # pw-play is a native PipeWire client and needs the raw PipeWire socket, which
  # Flatpak cannot expose via a --socket entry; the socket file from the runtime
  # dir is granted read-only instead. On hosts without PipeWire the mount is
  # simply skipped (pw-play then cannot connect, as on any PulseAudio-only host).
  - --filesystem=xdg-run/pipewire-0:ro
  # GPU rendering of the video player (QtMultimedia); drop it to force software rendering
  - --device=dri
  # desktop notifications (freedesktop.org Notifications; also used for the tray fallback)
  - --talk-name=org.freedesktop.Notifications
  # tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # History key: libsecret uses the Secret portal inside the sandbox; this is only the
  # fallback for desktops without that portal (KWallet, KeePassXC, ...)
  - --talk-name=org.freedesktop.secrets

# Video/audio codecs for QtMultimedia (attachment playback)
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg

modules:
  # Secret Service / Secret portal client library used by QtKeychain
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dbash_completion=disabled
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/GNOME/libsecret.git
        tag: 0.21.8
        commit: 257547ed7a541fc63400f91578216d3b53721c57
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+\.\d+)$

  - name: qtkeychain
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TEST_APPLICATION=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /lib/*.so
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        tag: 0.17.0
        commit: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+\.\d+)$

  # Only the qrencode command line tool (shows the QR code when linking a device)
  - name: libqrencode
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      # libqrencode 4.1.1 still declares cmake_minimum_required < 3.5, which CMake 4 rejects
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=OFF
      - -DWITH_TOOLS=ON
      - -DWITH_TESTS=OFF
    cleanup:
      - /include
      - /lib
      - /share/man
    sources:
      - type: git
        url: https://github.com/fukuchi/libqrencode.git
        tag: v4.1.1
        commit: 715e29fd4cd71b6e452ae0f4e36d917b43122ce8
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$

  # corvus-cli (https://github.com/ada-h00k/corvus-cli): the Rust Signal backend (presage) that
  # replaces signal-cli. A single native executable without Java; it speaks signal-cli's
  # JSON-RPC, so Corvus runs it unchanged. Corvus finds it on PATH (/app/bin).
  # The binary is the one built by corvus-cli's own release workflow, pinned by commit and
  # SHA-256 (the release tag is "commit-<sha>"). It only links the runtime's glibc, libstdc++
  # and libgcc.
  - name: corvus-cli
    buildsystem: simple
    only-arches: [x86_64]
    build-commands:
      - install -Dm755 corvus-cli-linux-x86_64 /app/bin/corvus-cli
    sources:
      - type: file
        url: https://github.com/ada-h00k/corvus-cli/releases/download/commit-4d76022c8ff0d2e4bc42d8392c0762024dfa1db9/corvus-cli-linux-x86_64
        sha256: 60e8fc21b9c500aeba50a5bc267c67b7ae601770cddcbd8b43569217da28ba68
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ada-h00k/corvus-cli/releases/latest
          version-query: .tag_name | sub("^commit-"; "")
          url-query: .assets[] | select(.name == "corvus-cli-linux-x86_64") | .browser_download_url

  - name: corvus
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        # crates vendored by cargo-sources.json (the build has no network access)
        CARGO_HOME: /run/build/corvus/cargo
        CARGO_NET_OFFLINE: 'true'
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    post-install:
      # Flatpak requires the desktop file and the icon to be named after the app ID
      - mv /app/share/applications/corvus.desktop /app/share/applications/io.github.ada_h00k.Corvus.desktop
      - sed -i 's|^Icon=.*|Icon=io.github.ada_h00k.Corvus|' /app/share/applications/io.github.ada_h00k.Corvus.desktop
      - mv /app/share/icons/hicolor/scalable/apps/corvus.svg /app/share/icons/hicolor/scalable/apps/io.github.ada_h00k.Corvus.svg
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/packaging/flatpak/io.github.ada_h00k.Corvus.metainfo.xml
        -t /app/share/metainfo
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/LICENSE -t /app/share/licenses/io.github.ada_h00k.Corvus
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
          - build
          - dist
      # generated from history-store/Cargo.lock by flatpak-cargo-generator.py
      - cargo-sources.json
