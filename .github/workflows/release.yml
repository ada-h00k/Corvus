name: Build Linux Release

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

# Der Workflow darf Releases erstellen.
permissions:
  contents: write

# Niemals zwei Releases für denselben Branch gleichzeitig bauen.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.8.3"

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # System dependencies
      # ------------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            file \
            wget \
            curl \
            ca-certificates \
            fuse3 \
            libfuse2t64 \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libx11-xcb1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxtst6 \
            libglib2.0-0 \
            libegl1 \
            libopengl0 \
            libqrencode-dev

      # ------------------------------------------------------------
      # Qt
      # ------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Verify Qt
        shell: bash
        run: |
          set -euo pipefail

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

          echo "PATH=$PATH"

          echo "Searching for qmake..."

          QMAKE_PATH="$(find "$QT_ROOT_DIR" -type f -name qmake -print -quit)"

          if [ -z "$QMAKE_PATH" ]; then
            echo "::error::qmake was not found in $QT_ROOT_DIR"
            exit 1
          fi

          echo "Found qmake:"
          echo "$QMAKE_PATH"

          "$QMAKE_PATH" --version

          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Rust
      # ------------------------------------------------------------

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust
        run: |
          rustc --version
          cargo --version

      # ------------------------------------------------------------
      # Rust tests
      # ------------------------------------------------------------

      - name: Run Rust tests
        run: |
          cargo test \
            --release \
            --locked \
            --manifest-path history-store/Cargo.toml

      # ------------------------------------------------------------
      # CMake configure
      # ------------------------------------------------------------

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build
        run: |
          cmake \
            --build build \
            --config ${{ env.BUILD_TYPE }} \
            --parallel "$(nproc)"

      # ------------------------------------------------------------
      # Find and verify executable
      # ------------------------------------------------------------

      - name: Find executable
        shell: bash
        run: |
          set -euo pipefail

          echo "Build output:"
          find build -maxdepth 3 -type f -executable -print

          if [ -f "build/signal-cli-qt" ]; then
            BINARY="build/signal-cli-qt"
          elif [ -f "build/bin/signal-cli-qt" ]; then
            BINARY="build/bin/signal-cli-qt"
          else
            echo "::error::Could not find signal-cli-qt binary"
            exit 1
          fi

          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

          echo "Using binary:"
          echo "$BINARY"

          file "$BINARY"

          chmod +x "$BINARY"

      # ------------------------------------------------------------
      # Prepare distribution directory
      # ------------------------------------------------------------

      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist

      # ------------------------------------------------------------
      # Plain Linux binary
      # ------------------------------------------------------------

      - name: Package Linux binary
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"

          cp "$BINARY" \
            "dist/signal-cli-qt-${SHORT_SHA}-linux-x86_64"

          chmod +x \
            "dist/signal-cli-qt-${SHORT_SHA}-linux-x86_64"

          file \
            "dist/signal-cli-qt-${SHORT_SHA}-linux-x86_64"

      # ------------------------------------------------------------
      # Download linuxdeploy
      # ------------------------------------------------------------

      - name: Download linuxdeploy
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --output linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy-x86_64.AppImage

          ./linuxdeploy-x86_64.AppImage --version || true

      # ------------------------------------------------------------
      # Download Qt linuxdeploy plugin
      # ------------------------------------------------------------

      - name: Download linuxdeploy Qt plugin
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --output linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      # ------------------------------------------------------------
      # AppDir
      # ------------------------------------------------------------

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail

          rm -rf AppDir

          mkdir -p \
            AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps

          cp "$BINARY" \
            AppDir/usr/bin/signal-cli-qt

          chmod +x \
            AppDir/usr/bin/signal-cli-qt

          cat > AppDir/usr/share/applications/signal-cli-qt.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=signal-cli Qt
          Comment=Qt GUI for signal-cli
          Exec=signal-cli-qt
          Terminal=false
          Categories=Network;InstantMessaging;
          EOF

          echo "AppDir:"
          find AppDir -type f -print

      # ------------------------------------------------------------
      # Build AppImage
      # ------------------------------------------------------------

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"

          echo "Qt root:"
          echo "$QT_ROOT_DIR"

          echo "QMake:"
          echo "$QMAKE"

          if [ ! -x "$QMAKE" ]; then
            echo "::error::QMAKE does not exist or is not executable"
            exit 1
          fi

          "$QMAKE" --version

          echo "Running linuxdeploy..."

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/signal-cli-qt.desktop \
            --plugin qt \
            --output appimage

          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"

          if [ -z "$APPIMAGE" ]; then
            echo "::error::linuxdeploy did not create an AppImage"
            exit 1
          fi

          echo "Created AppImage:"
          echo "$APPIMAGE"

          mv "$APPIMAGE" \
            "dist/signal-cli-qt-${SHORT_SHA}-x86_64.AppImage"

          chmod +x \
            "dist/signal-cli-qt-${SHORT_SHA}-x86_64.AppImage"

      # ------------------------------------------------------------
      # Verify AppImage
      # ------------------------------------------------------------

      - name: Verify AppImage
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"

          APPIMAGE="dist/signal-cli-qt-${SHORT_SHA}-x86_64.AppImage"
          BINARY="dist/signal-cli-qt-${SHORT_SHA}-linux-x86_64"

          test -f "$APPIMAGE"
          test -x "$APPIMAGE"

          test -f "$BINARY"
          test -x "$BINARY"

          echo "=== Binary ==="
          file "$BINARY"
          ls -lh "$BINARY"

          echo
          echo "=== AppImage ==="
          file "$APPIMAGE"
          ls -lh "$APPIMAGE"

          echo
          echo "=== AppDir ==="
          find AppDir -type f -print

      # ------------------------------------------------------------
      # Checksums
      # ------------------------------------------------------------

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          sha256sum * > SHA256SUMS

          cat SHA256SUMS

      # ------------------------------------------------------------
      # Upload workflow artifacts
      # ------------------------------------------------------------

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: signal-cli-qt-linux-${{ github.sha }}
          path: |
            dist/*
          if-no-files-found: error

      # ------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "build-${{ github.sha }}"
          name: "Build ${{ github.sha }}"
          target_commitish: ${{ github.sha }}

          body: |
            Automatic Linux x86_64 build.

            Commit:
            `${{ github.sha }}`

            Artifacts:

            - `signal-cli-qt-${{ github.sha }}-linux-x86_64`
            - `signal-cli-qt-${{ github.sha }}-x86_64.AppImage`
            - `SHA256SUMS`

            The AppImage contains the Qt runtime and required Qt plugins.

            `signal-cli` itself is not bundled and must be installed separately.

          draft: false
          prerelease: false
          make_latest: true

          files: |
            dist/signal-cli-qt-${{ github.sha }}-linux-x86_64
            dist/signal-cli-qt-${{ github.sha }}-x86_64.AppImage
            dist/SHA256SUMS
