name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-randr0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb1 \
            qrencode \
            file \
            wget

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"

      - name: Show toolchain versions
        run: |
          cmake --version
          gcc --version
          cargo --version
          rustc --version
          qmake --version || true

      - name: Run Rust tests
        run: |
          cargo test \
            --release \
            --locked \
            --manifest-path history-store/Cargo.toml

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel

      - name: Verify binary
        run: |
          test -f build/signal-cli-qt
          file build/signal-cli-qt
          chmod +x build/signal-cli-qt

      # ------------------------------------------------------------
      # Plain binary
      # ------------------------------------------------------------

      - name: Package plain binary
        run: |
          SHA="${GITHUB_SHA::7}"

          mkdir -p dist

          cp build/signal-cli-qt \
            "dist/signal-cli-qt-${SHA}-linux-x86_64"

          chmod +x \
            "dist/signal-cli-qt-${SHA}-linux-x86_64"

      # ------------------------------------------------------------
      # AppImage
      # ------------------------------------------------------------

      - name: Download linuxdeploy
        run: |
          wget -q \
            -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy-x86_64.AppImage

      - name: Download linuxdeploy Qt plugin
        run: |
          wget -q \
            -O linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Prepare AppImage
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp build/signal-cli-qt AppDir/usr/bin/signal-cli-qt
          chmod +x AppDir/usr/bin/signal-cli-qt

          # Create desktop entry if the repository does not provide one.
          cat > AppDir/usr/share/applications/signal-cli-qt.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=signal-cli Qt
          Comment=Native Qt GUI for signal-cli
          Exec=signal-cli-qt
          Terminal=false
          Categories=Network;InstantMessaging;
          EOF

      - name: Build AppImage
        env:
          QMAKE: ${{ env.Qt6_DIR }}/bin/qmake
        run: |
          SHA="${GITHUB_SHA::7}"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/signal-cli-qt.desktop \
            --plugin qt \
            --output appimage

          APPIMAGE="$(find . -maxdepth 1 -name '*.AppImage' -type f | head -n 1)"

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: AppImage was not created"
            exit 1
          fi

          mv "$APPIMAGE" \
            "dist/signal-cli-qt-${SHA}-x86_64.AppImage"

          chmod +x \
            "dist/signal-cli-qt-${SHA}-x86_64.AppImage"

      - name: Verify artifacts
        run: |
          echo "Artifacts:"
          ls -lah dist

          test -f "dist/signal-cli-qt-${GITHUB_SHA::7}-linux-x86_64"
          test -f "dist/signal-cli-qt-${GITHUB_SHA::7}-x86_64.AppImage"

          file dist/*

      # ------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automatic build for commit `${{ github.sha }}`.

            Linux x86_64 artifacts:

            - `signal-cli-qt-${{ github.sha }}-linux-x86_64` — plain binary
            - `signal-cli-qt-${{ github.sha }}-x86_64.AppImage` — self-contained AppImage

            The application still requires `signal-cli` to be installed separately.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/signal-cli-qt-${{ github.sha }}-linux-x86_64
            dist/signal-cli-qt-${{ github.sha }}-x86_64.AppImage
