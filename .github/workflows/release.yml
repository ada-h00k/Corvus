name: Build Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.12"
  QT_VERSION_WINDOWS: "6.8"

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # System dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            file \
            curl \
            wget \
            ca-certificates \
            fuse3 \
            libfuse2t64 \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-util1 \
            libx11-xcb1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libegl1 \
            libopengl0 \
            libqrencode-dev \
            qtkeychain-qt6-dev

      # --------------------------------------------------
      # Qt
      # --------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Configure Qt environment
        shell: bash
        run: |
          set -euo pipefail

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

          QMAKE_PATH="$(find "$QT_ROOT_DIR" \
            -type f -name qmake -print -quit)"

          if [ -z "$QMAKE_PATH" ]; then
            echo "::error::qmake not found in $QT_ROOT_DIR"
            exit 1
          fi

          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"
          "$QMAKE_PATH" --version

      # --------------------------------------------------
      # Rust
      # --------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail

          cargo test \
            --release \
            --locked \
            --manifest-path history-store/Cargo.toml

      # --------------------------------------------------
      # CMake
      # --------------------------------------------------
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      # --------------------------------------------------
      # Locate application executable
      # --------------------------------------------------
      - name: Locate executable
        shell: bash
        run: |
          set -euo pipefail

          find build -maxdepth 4 -type f -executable -print

          BINARY=""

          for candidate in \
            build/corvus \
            build/bin/corvus \
            build/Corvus \
            build/bin/Corvus
          do
            if [ -f "$candidate" ]; then
              BINARY="$candidate"
              break
            fi
          done

          if [ -z "$BINARY" ]; then
            echo "::error::Application binary not found. Check the CMake target name."
            exit 1
          fi

          echo "BINARY=$BINARY" >> "$GITHUB_ENV"
          file "$BINARY"

      # --------------------------------------------------
      # Plain Linux binary
      # --------------------------------------------------
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp "$BINARY" dist/corvus-linux-x86_64
          chmod +x dist/corvus-linux-x86_64

          mkdir -p "$RUNNER_TEMP/corvus-installer"
          cp dist/corvus-linux-x86_64 "$RUNNER_TEMP/corvus-installer/"
          cp packaging/install.sh packaging/corvus.desktop packaging/corvus.svg \
            "$RUNNER_TEMP/corvus-installer/"
          chmod +x "$RUNNER_TEMP/corvus-installer/install.sh"
          tar -czf "$GITHUB_WORKSPACE/dist/corvus-linux-x86_64-installer.tar.gz" \
            -C "$RUNNER_TEMP/corvus-installer" .

      # --------------------------------------------------
      # Validate output and checksums
      # --------------------------------------------------
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/corvus-linux-x86_64
          test -s dist/corvus-linux-x86_64-installer.tar.gz

          tar -tzf dist/corvus-linux-x86_64-installer.tar.gz

          file dist/corvus-linux-x86_64

          (
            cd dist
            sha256sum \
              corvus-linux-x86_64 \
              corvus-linux-x86_64-installer.tar.gz \
              > SHA256SUMS
          )

          cat dist/SHA256SUMS
          ls -lh dist

      # --------------------------------------------------
      # Preserve artifacts even when a later step fails
      # --------------------------------------------------
      - name: Upload build artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: corvus-linux-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14


  # ------------------------------------------------------
  # Arch Linux package (built natively in an Arch container)
  # ------------------------------------------------------
  arch-package:
    name: Build Arch Linux package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel

    steps:
      # git must exist before checkout so that the full history is cloned
      - name: Install git
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare source tarball and PKGBUILD
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          base="$(sed -n 's/^project(corvus VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          count="$(git rev-list --count HEAD)"
          short="$(git rev-parse --short=7 HEAD)"
          pkgver="${base}.r${count}.g${short}"
          echo "PKGVER=$pkgver" >> "$GITHUB_ENV"

          # makepkg refuses to run as root
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

          build_dir=/home/builder/pkg
          mkdir -p "$build_dir"

          git archive --format=tar.gz \
            --prefix="corvus-${pkgver}/" \
            -o "$build_dir/corvus-${pkgver}.tar.gz" HEAD
          cp packaging/arch/PKGBUILD "$build_dir/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" "$build_dir/PKGBUILD"

          chown -R builder:builder /home/builder
          cat "$build_dir/PKGBUILD"

      - name: Build package
        shell: bash
        run: |
          set -euxo pipefail
          su builder -c 'cd ~/pkg && makepkg --syncdeps --noconfirm --nocolor'

      - name: Inspect package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp /home/builder/pkg/*.pkg.tar.zst dist/

          for pkg in dist/*.pkg.tar.zst; do
            pacman -Qip "$pkg"
            pacman -Qlp "$pkg"
          done

          # the package must contain the executable, desktop entry, icon and license
          files="$(pacman -Qlp dist/*.pkg.tar.zst)"
          for path in \
            /usr/bin/corvus \
            /usr/share/applications/corvus.desktop \
            /usr/share/icons/hicolor/scalable/apps/corvus.svg \
            /usr/share/licenses/corvus/LICENSE
          do
            if ! grep -qxF "corvus $path" <<< "$files"; then
              echo "::error::Package is missing $path"
              exit 1
            fi
          done

      - name: Upload Arch package artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: corvus-arch-${{ github.sha }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # Flatpak (KDE runtime, sandboxed, ships signal-cli and qrencode)
  # ------------------------------------------------------
  flatpak:
    name: Build Flatpak (x86_64)
    runs-on: ubuntu-24.04
    env:
      FLATPAK_APP_ID: io.github.ada_h00k.Corvus
      FLATPAK_MANIFEST: packaging/flatpak/io.github.ada_h00k.Corvus.yml
      # https://github.com/flatpak/flatpak-builder-tools (cargo/flatpak-cargo-generator.py)
      CARGO_GENERATOR_REF: 74697c75b630d7330e77250fc13cb5ea688d9479

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            appstream \
            desktop-file-utils \
            python3-venv

          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

          flatpak --version
          flatpak-builder --version

          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      # The Flatpak build has no network access: all crates of the Rust history store are
      # vendored from Cargo.lock into cargo-sources.json (kept out of git, always in sync).
      - name: Generate Cargo sources
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv "$RUNNER_TEMP/cargo-gen"
          "$RUNNER_TEMP/cargo-gen/bin/pip" install --quiet aiohttp tomlkit PyYAML

          curl -fsSL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${CARGO_GENERATOR_REF}/cargo/flatpak-cargo-generator.py"

          "$RUNNER_TEMP/cargo-gen/bin/python" "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            history-store/Cargo.lock \
            -o packaging/flatpak/cargo-sources.json

          test -s packaging/flatpak/cargo-sources.json

      - name: Cache Flatpak sources
        uses: actions/cache@v4
        with:
          path: .flatpak-builder/downloads
          key: flatpak-sources-${{ hashFiles('packaging/flatpak/*.yml', 'history-store/Cargo.lock') }}
          restore-keys: |
            flatpak-sources-

      - name: Build Flatpak
        shell: bash
        run: |
          set -euxo pipefail

          flatpak-builder \
            --user \
            --force-clean \
            --install-deps-from=flathub \
            --default-branch=stable \
            --repo=flatpak-repo \
            flatpak-build \
            "$FLATPAK_MANIFEST"

      # --------------------------------------------------
      # Validate metadata and the sandbox permissions
      # --------------------------------------------------
      - name: Validate desktop file and AppStream metadata
        shell: bash
        run: |
          set -euxo pipefail

          files=flatpak-build/files/share
          desktop="$files/applications/$FLATPAK_APP_ID.desktop"
          metainfo="$files/metainfo/$FLATPAK_APP_ID.metainfo.xml"
          icon="$files/icons/hicolor/scalable/apps/$FLATPAK_APP_ID.svg"

          test -s "$desktop"
          test -s "$metainfo"
          test -s "$icon"

          desktop-file-validate "$desktop"
          grep -qx "Icon=$FLATPAK_APP_ID" "$desktop"
          appstreamcli validate --no-net "$metainfo"

      - name: Check sandbox permissions
        shell: bash
        run: |
          set -euo pipefail

          cat flatpak-build/metadata

          # Only the KDE runtime default "xdg-config/kdeglobals:ro" (Plasma colour scheme) is
          # accepted as file system access. Everything else, broad devices, sockets or bus
          # access fails the build. (If one is ever needed on purpose, adjust the patterns.)
          forbidden='^filesystems=|^devices=.*all|^sockets=(.*;)?x11;|^sockets=.*(ssh-auth|pcsc|cups|gpg-agent|system-bus)|^org\.freedesktop\.Flatpak=|=own$|^\[System Bus Policy\]'
          checked="$(grep -v -x 'filesystems=xdg-config/kdeglobals:ro;' flatpak-build/metadata || true)"
          if grep -E "$forbidden" <<< "$checked"; then
            echo "::error::The Flatpak requests more permissions than intended. See the metadata above."
            exit 1
          fi

      # --------------------------------------------------
      # Bundle
      # --------------------------------------------------
      - name: Create Flatpak bundle
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            dist/corvus-linux-x86_64.flatpak \
            "$FLATPAK_APP_ID" \
            stable

          test -s dist/corvus-linux-x86_64.flatpak
          ls -lh dist

      # Install the bundle like a user would and check that everything it ships actually runs
      - name: Smoke test installed Flatpak
        shell: bash
        run: |
          set -euxo pipefail

          flatpak install --user --noninteractive --bundle dist/corvus-linux-x86_64.flatpak

          # effective permissions of the installed app
          flatpak info --user --show-permissions "$FLATPAK_APP_ID"

          flatpak run --command=signal-cli "$FLATPAK_APP_ID" --version
          flatpak run --command=qrencode "$FLATPAK_APP_ID" -V

          # every shared library of the executable must be found inside the sandbox
          flatpak run --command=sh "$FLATPAK_APP_ID" -c '
            missing="$(ldd /app/bin/corvus | grep "not found" || true)"
            if [ -n "$missing" ]; then
              echo "$missing"
              exit 1
            fi
          '

          # signal-cli has to be found by Corvus through PATH
          flatpak run --command=sh "$FLATPAK_APP_ID" -c 'command -v signal-cli'

      # The unsigned OSTree repository for the Pages job (only if publishing is enabled).
      # It is signed there, so the signing key never reaches the job that builds the code.
      - name: Pack OSTree repository
        if: vars.FLATPAK_REPO_PUBLISH == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          tar -C flatpak-repo -cf flatpak-repo.tar .
          ls -lh flatpak-repo.tar

      - name: Upload OSTree repository
        if: vars.FLATPAK_REPO_PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-repo-${{ github.sha }}
          path: flatpak-repo.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload Flatpak artifact
        if: always() && hashFiles('dist/*.flatpak') != ''
        uses: actions/upload-artifact@v7
        with:
          name: corvus-flatpak-${{ github.sha }}
          path: dist/*.flatpak
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # macOS app (Swift / SwiftUI, Apple silicon)
  # ------------------------------------------------------
  macos-app:
    name: Build macOS app (arm64)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Builds the Rust history store, the Swift package and the .app bundle
      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          macos/scripts/build-app.sh

      - name: Run Swift tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path macos

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          ditto -c -k --keepParent "macos/build/Corvus.app" dist/corvus-macos-arm64.zip

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/corvus-macos-arm64.zip
          unzip -l dist/corvus-macos-arm64.zip
          codesign --verify --deep --strict --verbose "macos/build/Corvus.app"
          file "macos/build/Corvus.app/Contents/MacOS/corvus"
          ls -lh dist

          # Files created by the app must be quarantined; signal-cli runs through the helper app.
          packaging/macos/check-signal-cli-helper.sh macos/build/Corvus.app

      - name: Upload build artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: corvus-macos-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # macOS Qt app (Qt, Apple silicon)
  # ------------------------------------------------------
  macos-qt-app:
    name: Build Qt macOS app (arm64)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install cmake ninja pkgconf qrencode

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Configure Homebrew dependency paths
        shell: bash
        run: |
          set -euo pipefail

          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix qrencode)/lib/pkgconfig:$(brew --prefix libpng)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
            >> "$GITHUB_ENV"

      # Build QtKeychain against the same Qt installation as the application.
      - name: Build QtKeychain
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch 0.17.0 \
            https://github.com/frankosterfeld/qtkeychain.git \
            "$RUNNER_TEMP/qtkeychain-src"

          cmake \
            -S "$RUNNER_TEMP/qtkeychain-src" \
            -B "$RUNNER_TEMP/qtkeychain-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qtkeychain-install" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TEST_APPLICATION=OFF

          cmake --build "$RUNNER_TEMP/qtkeychain-build" --parallel
          cmake --install "$RUNNER_TEMP/qtkeychain-build"

          echo "QTKEYCHAIN_PREFIX=$RUNNER_TEMP/qtkeychain-install" \
            >> "$GITHUB_ENV"

      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail

          cargo test \
            --release \
            --locked \
            --manifest-path history-store/Cargo.toml

      - name: Configure Qt CMake build
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-qt \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$QTKEYCHAIN_PREFIX;$HOMEBREW_PREFIX"

      - name: Build Qt application
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-qt --parallel

      - name: Deploy Qt frameworks and plugins
        shell: bash
        run: |
          set -euxo pipefail

          # By name: build-qt also contains the helper bundle (corvus-signal-cli.app).
          APP_PATH=build-qt/corvus.app

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app bundle found. Check the CMake executable target and MACOSX_BUNDLE setting."
            exit 1
          fi

          APP_PATH="$(cd "$(dirname "$APP_PATH")" && pwd)/$(basename "$APP_PATH")"

          "$QT_ROOT_DIR/bin/macdeployqt" "$APP_PATH" \
            -always-overwrite \
            -codesign=- \
            -verbose=2 \
            -libpath="$QTKEYCHAIN_PREFIX/lib" \
            -libpath="$(brew --prefix qrencode)/lib" \
            -libpath="$(brew --prefix libpng)/lib"

          echo "QT_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package and verify Qt app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          test -d "$QT_APP_PATH"
          test -s "$QT_APP_PATH/Contents/Info.plist"

          codesign --verify --deep --strict --verbose=2 "$QT_APP_PATH"

          # Files created by the app must be quarantined; signal-cli runs through the helper app.
          packaging/macos/check-signal-cli-helper.sh "$QT_APP_PATH"

          find "$QT_APP_PATH/Contents/MacOS" \
            -maxdepth 1 -type f -exec file {} \;

          ditto -c -k --keepParent \
            "$QT_APP_PATH" \
            dist/corvus-qt-macos-arm64.zip

          test -s dist/corvus-qt-macos-arm64.zip
          unzip -l dist/corvus-qt-macos-arm64.zip
          ls -lh dist

      - name: Upload Qt macOS artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: corvus-qt-macos-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # Windows (Qt, x86_64): portable zip + English setup with optional signal-cli download
  # ------------------------------------------------------
  windows-app:
    name: Build Windows x86_64 (Qt + setup)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Git for Windows ships GNU "link.exe" (usr\bin), which shadows the MSVC linker in bash
      # steps and breaks Rust/CMake links ("/usr/bin/link: extra operand"). Remove it.
      - name: Remove GNU link.exe
        shell: pwsh
        run: |
          $gnu = 'C:\Program Files\Git\usr\bin\link.exe'
          if (Test-Path $gnu) { Remove-Item $gnu -Force }
          (Get-Command link.exe -All).Source

      # Qt 6.12.0 is listed by aqtinstall but its Windows (MSVC) packages are not downloadable
      # ("Failed to locate XML data"). The Windows build therefore uses the 6.8 LTS series.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          host: windows
          target: desktop
          modules: qtmultimedia
          cache: true

      # QtKeychain uses the Windows Credential Manager. Built against the same Qt.
      - name: Build QtKeychain
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch 0.17.0 \
            https://github.com/frankosterfeld/qtkeychain.git \
            "$RUNNER_TEMP/qtkeychain-src"

          cmake \
            -S "$RUNNER_TEMP/qtkeychain-src" \
            -B "$RUNNER_TEMP/qtkeychain-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$RUNNER_TEMP")/qtkeychain-install" \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_ROOT_DIR")" \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TEST_APPLICATION=OFF

          cmake --build "$RUNNER_TEMP/qtkeychain-build" --parallel
          cmake --install "$RUNNER_TEMP/qtkeychain-build"

          echo "QTKEYCHAIN_PREFIX=$(cygpath -m "$RUNNER_TEMP")/qtkeychain-install" >> "$GITHUB_ENV"

      # qrencode.exe is used to show the QR code when linking a device. Statically linked,
      # so a single .exe. It is part of both the setup and the portable zip; the build fails
      # if it cannot be built or does not work.
      - name: Build qrencode
        shell: bash
        run: |
          set -euxo pipefail

          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "libqrencode[tool]:x64-windows-static"

          ROOT="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static"
          QR="$(find "$ROOT" -iname qrencode.exe -print -quit)"
          if [ -z "$QR" ]; then
            echo "::error::vcpkg did not produce qrencode.exe"
            exit 1
          fi

          OUT="$RUNNER_TEMP/qrencode"
          mkdir -p "$OUT"
          cp "$QR" "$OUT/qrencode.exe"

          # Smoke test, same call as src/LinkDialog.cpp: PNG written to a file. (Not to stdout:
          # qrencode.exe does not switch stdout to binary mode on Windows, which would turn
          # 0A into 0D0A and corrupt the PNG.)
          "$OUT/qrencode.exe" -V
          "$OUT/qrencode.exe" -t PNG -s 6 -m 2 -o "$OUT/test.png" \
            "sgnl://linkdevice?uuid=ci-test&pub_key=ci-test"
          sig="$(head -c 8 "$OUT/test.png" | od -An -tx1 | tr -d ' \n')"
          if [ "$sig" != "89504e470d0a1a0a" ]; then
            echo "::error::qrencode.exe did not write a valid PNG (signature: $sig)"
            exit 1
          fi
          rm -f "$OUT/test.png"

          # libqrencode is LGPL-2.1+: ship its license text with the binary
          LIC="$(find "$ROOT/share/libqrencode" -iname copyright -print -quit 2>/dev/null || true)"
          if [ -n "$LIC" ]; then
            cp "$LIC" "$OUT/libqrencode-COPYING.txt"
          else
            echo "::warning::libqrencode license file not found in vcpkg"
          fi

          echo "QRENCODE_EXE=$(cygpath -m "$OUT")/qrencode.exe" >> "$GITHUB_ENV"
          echo "QRENCODE_LICENSE=$(cygpath -m "$OUT")/libqrencode-COPYING.txt" >> "$GITHUB_ENV"

      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path history-store/Cargo.toml

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_ROOT_DIR");$QTKEYCHAIN_PREFIX"

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Deploy Qt runtime
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p stage
          cp build/corvus.exe stage/

          # QtKeychain DLL (name differs between versions)
          find "$QTKEYCHAIN_PREFIX" -iname 'qt*keychain*.dll' -exec cp {} stage/ \;
          ls stage

          # windeployqt treats "qt6keychain.dll" as a Qt module and looks for it in Qt's bin
          # directory, so make it available there.
          find "$QTKEYCHAIN_PREFIX" -iname 'qt*keychain*.dll' -exec cp {} "$QT_ROOT_DIR/bin/" \;

          windeployqt --release --no-translations --compiler-runtime \
            --dir stage stage/corvus.exe

          # the keychain DLL must be next to corvus.exe, whatever windeployqt did with it
          find "$QTKEYCHAIN_PREFIX" -iname 'qt*keychain*.dll' -exec cp {} stage/ \;

          # qrencode.exe next to corvus.exe (src/LinkDialog.cpp looks there first)
          test -f "$QRENCODE_EXE"
          cp "$QRENCODE_EXE" stage/qrencode.exe
          if [ -f "$QRENCODE_LICENSE" ]; then
            mkdir -p stage/licenses
            cp "$QRENCODE_LICENSE" stage/licenses/libqrencode-COPYING.txt
          fi

          find stage -maxdepth 1 -type f | sort

      # The setup downloads signal-cli from github.com/AsamK/signal-cli at install time.
      # Check here that the lookup script still works against the real GitHub / Adoptium APIs.
      - name: Test release lookup script
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'release-info.txt'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/fetch-release-info.ps1 `
              -OutFile $out -WantSignalCli 1 -WantJava 1 -JavaMajor 25
          Get-Content $out
          if ($LASTEXITCODE -ne 0) { throw 'fetch-release-info.ps1 failed' }
          $text = Get-Content $out -Raw
          if ($text -notmatch 'signalcli_url=https://github\.com/AsamK/signal-cli/releases/download/') { throw 'signal-cli URL missing' }
          if ($text -notmatch 'java_url=https://') { throw 'Java URL missing' }

      - name: Build setup and portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }

          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(corvus VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          & $iscc "/DAppVersion=$version" "/DStageDir=$((Resolve-Path stage).Path)" packaging\windows\corvus.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

          Compress-Archive -Path stage\* -DestinationPath dist\corvus-windows-x64-portable.zip -Force

          Get-ChildItem dist | Format-Table Name, Length

      # Install the real setup silently (no signal-cli / Java download) and check that
      # qrencode.exe really ends up in the install folder and runs from there.
      - name: Test setup installs qrencode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $setup = (Resolve-Path 'dist\corvus-windows-x64-setup.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'corvus-install-test'
          $log = Join-Path $env:RUNNER_TEMP 'corvus-setup.log'

          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir", "/LOG=$log")
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 50 }
            throw "Setup exited with code $($p.ExitCode)"
          }

          foreach ($f in 'corvus.exe', 'qrencode.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f was not installed by the setup" }
          }

          & (Join-Path $dir 'qrencode.exe') -V
          if ($LASTEXITCODE -ne 0) { throw 'Installed qrencode.exe does not run' }

          $unins = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          if ($unins) { Start-Process -FilePath $unins.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait }

      - name: Verify artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'dist\corvus-windows-x64-setup.exe', 'dist\corvus-windows-x64-portable.zip') {
            if (-not (Test-Path $f) -or (Get-Item $f).Length -eq 0) { throw "$f is missing or empty" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path dist\corvus-windows-x64-portable.zip).Path)
          $names = $zip.Entries | ForEach-Object { $_.FullName }
          $zip.Dispose()
          foreach ($n in 'corvus.exe', 'qrencode.exe', 'Qt6Core.dll', 'Qt6Widgets.dll') {
            if ($names -notcontains $n) { throw "$n is missing in the portable zip" }
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: corvus-windows-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # Signed Flatpak repository on GitHub Pages (automatic updates via `flatpak update`)
  # Enabled with the repository variable FLATPAK_REPO_PUBLISH=true
  # ------------------------------------------------------
  flatpak-repo:
    name: Publish Flatpak repository (GitHub Pages)
    if: vars.FLATPAK_REPO_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    needs:
      - flatpak
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FLATPAK_APP_ID: io.github.ada_h00k.Corvus
      FLATPAK_BRANCH: stable

    steps:
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Download OSTree repository
        uses: actions/download-artifact@v8
        with:
          name: flatpak-repo-${{ github.sha }}
          path: .

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg

      - name: Import signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::The secret FLATPAK_GPG_PRIVATE_KEY is not set (see the setup guide)."
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import <<< "$GPG_PRIVATE_KEY"

          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          if [ -z "$fpr" ]; then
            echo "::error::No secret key found in FLATPAK_GPG_PRIVATE_KEY."
            exit 1
          fi

          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_FPR=$fpr" >> "$GITHUB_ENV"
          echo "Signing with key $fpr"

      # Every commit of the repository (app, locale and debug refs) gets signed, then the
      # summary. Flatpak refuses unsigned commits from a remote that has a GPG key.
      - name: Sign repository
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p site/repo
          tar -xf flatpak-repo.tar -C site/repo

          for ref in $(ostree refs --repo=site/repo); do
            commit="$(ostree rev-parse --repo=site/repo "$ref")"
            ostree gpg-sign --repo=site/repo --gpg-homedir="$GNUPGHOME" "$commit" "$GPG_FPR"
            ostree show --repo=site/repo --list-detached-metadata-keys "$commit" | grep -q ostree.gpgsigs
          done

          flatpak build-update-repo \
            --gpg-sign="$GPG_FPR" \
            --gpg-homedir="$GNUPGHOME" \
            --prune --prune-depth=1 \
            site/repo

          test -s site/repo/summary
          test -s site/repo/summary.sig
          ostree refs --repo=site/repo

      - name: Create remote description files and start page
        shell: bash
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          base="${BASE_URL%/}"
          gpgkey="$(gpg --export "$GPG_FPR" | base64 -w0)"

          cat > site/corvus.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Corvus
          Url=$base/repo/
          Homepage=$REPO_URL
          Comment=Desktop client for Signal
          Description=Corvus, a Qt 6 desktop client for Signal (includes signal-cli)
          GPGKey=$gpgkey
          EOF

          cat > site/$FLATPAK_APP_ID.flatpakref <<EOF
          [Flatpak Ref]
          Title=Corvus
          Name=$FLATPAK_APP_ID
          Branch=$FLATPAK_BRANCH
          Url=$base/repo/
          SuggestRemoteName=corvus
          IsRuntime=false
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          GPGKey=$gpgkey
          EOF

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Corvus Flatpak repository</title>
            <style>
              body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 3rem auto; padding: 0 1rem; }
              pre { background: #8881; padding: .8rem 1rem; overflow-x: auto; border-radius: 6px; }
            </style>
          </head>
          <body>
            <h1>Corvus Flatpak repository</h1>
            <p>Signed Flatpak repository for <a href="$REPO_URL">Corvus</a>. Updates arrive with <code>flatpak update</code>.</p>
            <h2>Install</h2>
            <pre>flatpak remote-add --user --if-not-exists corvus $base/corvus.flatpakrepo
          flatpak install --user corvus $FLATPAK_APP_ID</pre>
            <p>Or download <a href="$FLATPAK_APP_ID.flatpakref">$FLATPAK_APP_ID.flatpakref</a> and open it with your software center.</p>
            <h2>Run</h2>
            <pre>flatpak run $FLATPAK_APP_ID</pre>
          </body>
          </html>
          EOF

          ls -lh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------
  # Create a release for every commit (all artifacts together)
  # ------------------------------------------------------
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    needs:
      - build
      - arch-package
      - flatpak
      - macos-app
      - macos-qt-app
      - windows-app

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: corvus-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Regenerate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS

          cat SHA256SUMS
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatic Linux x86_64 (including Flatpak), Windows x86_64 and macOS (Apple silicon) builds.
            macOS includes both the native SwiftUI app and the Qt app.

            Commit: `${{ github.sha }}`

            Files:
            - `corvus-linux-x86_64` — plain executable
            - `corvus-linux-x86_64-installer.tar.gz` — executable, per-user installer, and menu resources
            - `corvus-<version>-1-x86_64.pkg.tar.zst` — Arch Linux package (`sudo pacman -U <file>`)
            - `corvus-linux-x86_64.flatpak` — sandboxed Flatpak bundle incl. signal-cli (`flatpak install --user ./corvus-linux-x86_64.flatpak`)
            - `corvus-macos-arm64.zip` — native SwiftUI app for Apple silicon, macOS 14 or newer
            - `corvus-qt-macos-arm64.zip` — Qt app for Apple silicon, including deployed Qt dependencies
            - `corvus-windows-x64-setup.exe` — Windows setup (English); can download signal-cli from its official GitHub releases
            - `corvus-windows-x64-portable.zip` — Windows, no installation (unzip and run `corvus.exe`)
            - `SHA256SUMS` — SHA-256 checksums for all files above

            `signal-cli` must be installed separately (not for the Flatpak, which includes it; on Arch e.g. from the AUR, on macOS `brew install signal-cli`; the Windows setup offers to download it).
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/corvus-linux-x86_64
            dist/corvus-linux-x86_64-installer.tar.gz
            dist/*.pkg.tar.zst
            dist/corvus-linux-x86_64.flatpak
            dist/corvus-macos-arm64.zip
            dist/corvus-qt-macos-arm64.zip
            dist/corvus-windows-x64-setup.exe
            dist/corvus-windows-x64-portable.zip
            dist/SHA256SUMS
