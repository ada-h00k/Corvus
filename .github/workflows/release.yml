name: Build Release (Linux + macOS)

on:
  push:
    branches:
      - main
      - master
      - macos-build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.12"

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # System dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            file \
            curl \
            wget \
            ca-certificates \
            fuse3 \
            libfuse2t64 \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-util1 \
            libx11-xcb1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libegl1 \
            libopengl0 \
            libqrencode-dev \
            qtkeychain-qt6-dev

      # --------------------------------------------------
      # Qt
      # --------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Configure Qt environment
        shell: bash
        run: |
          set -euo pipefail

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

          QMAKE_PATH="$(find "$QT_ROOT_DIR" \
            -type f -name qmake -print -quit)"

          if [ -z "$QMAKE_PATH" ]; then
            echo "::error::qmake not found in $QT_ROOT_DIR"
            exit 1
          fi

          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"
          "$QMAKE_PATH" --version

      # --------------------------------------------------
      # Rust
      # --------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail

          cargo test \
            --release \
            --locked \
            --manifest-path history-store/Cargo.toml

      # --------------------------------------------------
      # CMake
      # --------------------------------------------------
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      # --------------------------------------------------
      # Locate application executable
      # --------------------------------------------------
      - name: Locate executable
        shell: bash
        run: |
          set -euo pipefail

          find build -maxdepth 4 -type f -executable -print

          BINARY=""

          for candidate in \
            build/signal-cli-qt \
            build/bin/signal-cli-qt \
            build/signal-cli-Qt \
            build/bin/signal-cli-Qt
          do
            if [ -f "$candidate" ]; then
              BINARY="$candidate"
              break
            fi
          done

          if [ -z "$BINARY" ]; then
            echo "::error::Application binary not found. Check the CMake target name."
            exit 1
          fi

          echo "BINARY=$BINARY" >> "$GITHUB_ENV"
          file "$BINARY"

      # --------------------------------------------------
      # Plain Linux binary
      # --------------------------------------------------
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp "$BINARY" dist/signal-cli-qt-linux-x86_64
          chmod +x dist/signal-cli-qt-linux-x86_64

          mkdir -p "$RUNNER_TEMP/signal-cli-qt-installer"
          cp dist/signal-cli-qt-linux-x86_64 "$RUNNER_TEMP/signal-cli-qt-installer/"
          cp packaging/install.sh packaging/signal-cli-qt.desktop packaging/signal-cli-qt.svg \
            "$RUNNER_TEMP/signal-cli-qt-installer/"
          chmod +x "$RUNNER_TEMP/signal-cli-qt-installer/install.sh"
          tar -czf "$GITHUB_WORKSPACE/dist/signal-cli-qt-linux-x86_64-installer.tar.gz" \
            -C "$RUNNER_TEMP/signal-cli-qt-installer" .

      # --------------------------------------------------
      # Validate output and checksums
      # --------------------------------------------------
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/signal-cli-qt-linux-x86_64
          test -s dist/signal-cli-qt-linux-x86_64-installer.tar.gz

          tar -tzf dist/signal-cli-qt-linux-x86_64-installer.tar.gz

          file dist/signal-cli-qt-linux-x86_64

          (
            cd dist
            sha256sum \
              signal-cli-qt-linux-x86_64 \
              signal-cli-qt-linux-x86_64-installer.tar.gz \
              > SHA256SUMS
          )

          cat dist/SHA256SUMS
          ls -lh dist

      # --------------------------------------------------
      # Preserve artifacts even when a later step fails
      # --------------------------------------------------
      - name: Upload build artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signal-cli-qt-linux-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14


  # ------------------------------------------------------
  # Arch Linux package (built natively in an Arch container)
  # ------------------------------------------------------
  arch-package:
    name: Build Arch Linux package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel

    steps:
      # git must exist before checkout so that the full history is cloned
      - name: Install git
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare source tarball and PKGBUILD
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          base="$(sed -n 's/^project(signal-cli-qt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          count="$(git rev-list --count HEAD)"
          short="$(git rev-parse --short=7 HEAD)"
          pkgver="${base}.r${count}.g${short}"
          echo "PKGVER=$pkgver" >> "$GITHUB_ENV"

          # makepkg refuses to run as root
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

          build_dir=/home/builder/pkg
          mkdir -p "$build_dir"

          git archive --format=tar.gz \
            --prefix="signal-cli-qt-${pkgver}/" \
            -o "$build_dir/signal-cli-qt-${pkgver}.tar.gz" HEAD
          cp packaging/arch/PKGBUILD "$build_dir/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" "$build_dir/PKGBUILD"

          chown -R builder:builder /home/builder
          cat "$build_dir/PKGBUILD"

      - name: Build package
        shell: bash
        run: |
          set -euxo pipefail
          su builder -c 'cd ~/pkg && makepkg --syncdeps --noconfirm --nocolor'

      - name: Inspect package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp /home/builder/pkg/*.pkg.tar.zst dist/

          for pkg in dist/*.pkg.tar.zst; do
            pacman -Qip "$pkg"
            pacman -Qlp "$pkg"
          done

          # the package must contain the executable, desktop entry, icon and license
          files="$(pacman -Qlp dist/*.pkg.tar.zst)"
          for path in \
            /usr/bin/signal-cli-qt \
            /usr/share/applications/signal-cli-qt.desktop \
            /usr/share/icons/hicolor/scalable/apps/signal-cli-qt.svg \
            /usr/share/licenses/signal-cli-qt/LICENSE
          do
            if ! grep -qxF "signal-cli-qt $path" <<< "$files"; then
              echo "::error::Package is missing $path"
              exit 1
            fi
          done

      - name: Upload Arch package artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signal-cli-qt-arch-${{ github.sha }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # macOS Apple Silicon (arm64)
  # ------------------------------------------------------
  build-macos:
    name: Build macOS arm64
    runs-on: macos-14   # Apple Silicon (M1)

    env:
      QTKEYCHAIN_VERSION: v0.14.0
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install ninja cmake pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path history-store/Cargo.toml

      # QtKeychain is not part of the aqt Qt, so build it against it
      # (uses the macOS Keychain as backend).
      - name: Build QtKeychain
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$QTKEYCHAIN_VERSION" \
            https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"

          # Upstream bug in v0.14.0: on Apple, isAvailable() is defined at global
          # scope instead of in namespace QKeychain, so the app fails to link with
          # "Undefined symbols: QKeychain::isAvailable()". Fix the one line.
          perl -0pi -e 's/\nbool isAvailable\(\)/\nbool QKeychain::isAvailable()/' \
            "$RUNNER_TEMP/qtkeychain/keychain_apple.mm"
          grep -q "bool QKeychain::isAvailable()" "$RUNNER_TEMP/qtkeychain/keychain_apple.mm"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qtkeychain-install" \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TEST_APPLICATION=OFF \
            -DBUILD_TRANSLATIONS=OFF
          cmake --build "$RUNNER_TEMP/qtkeychain-build" --parallel
          cmake --install "$RUNNER_TEMP/qtkeychain-build"

          # Fail early if the library still lacks the symbol the app needs
          ls -l "$RUNNER_TEMP"/qtkeychain-install/lib/
          nm -gU "$RUNNER_TEMP"/qtkeychain-install/lib/libqt6keychain*.dylib \
            | grep "__ZN9QKeychain11isAvailableEv"

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/qtkeychain-install"

      - name: Build
        run: cmake --build build --parallel

      # The CMake project builds a bare executable, so wrap it in an .app
      # bundle here (no source changes needed). macdeployqt then copies the
      # Qt frameworks and plugins into it.
      - name: Create app bundle
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(sed -n 's/^project(signal-cli-qt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          APP="dist/signal-cli-qt.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/signal-cli-qt "$APP/Contents/MacOS/signal-cli-qt"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>signal-cli Qt</string>
            <key>CFBundleDisplayName</key><string>signal-cli Qt</string>
            <key>CFBundleIdentifier</key><string>io.github.ada-h00k.signal-cli-qt</string>
            <key>CFBundleExecutable</key><string>signal-cli-qt</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>${MACOSX_DEPLOYMENT_TARGET}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"

      - name: Bundle Qt (macdeployqt)
        shell: bash
        run: |
          set -euxo pipefail
          "$QT_ROOT_DIR/bin/macdeployqt" dist/signal-cli-qt.app \
            -libpath="$RUNNER_TEMP/qtkeychain-install/lib" \
            -verbose=1

          # Ad-hoc signature: arm64 binaries must be signed to run at all.
          # This is not a Developer ID signature; Gatekeeper still asks once.
          codesign --force --deep --sign - dist/signal-cli-qt.app
          codesign --verify --deep --strict --verbose=2 dist/signal-cli-qt.app

          # Fail if the binary still points at build-machine paths
          if otool -L dist/signal-cli-qt.app/Contents/MacOS/signal-cli-qt \
              | grep -E "$RUNNER_TEMP|/Users/runner"; then
            echo "::error::Binary still links against build-machine paths"
            exit 1
          fi

          file dist/signal-cli-qt.app/Contents/MacOS/signal-cli-qt
          lipo -archs dist/signal-cli-qt.app/Contents/MacOS/signal-cli-qt

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          cd dist
          hdiutil create -volname "signal-cli Qt" \
            -srcfolder signal-cli-qt.app -ov -format UDZO \
            signal-cli-qt-macos-arm64.dmg
          ditto -c -k --keepParent signal-cli-qt.app signal-cli-qt-macos-arm64.app.zip
          rm -rf signal-cli-qt.app
          shasum -a 256 signal-cli-qt-macos-arm64.dmg signal-cli-qt-macos-arm64.app.zip \
            | tee SHA256SUMS
          ls -lh

      - name: Upload build artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signal-cli-qt-macos-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # Create a release for every commit (all artifacts together)
  # ------------------------------------------------------
  release:
    name: Publish release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs:
      - build
      - build-macos
      - arch-package

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: signal-cli-qt-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Regenerate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS

          cat SHA256SUMS
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatic build (Linux x86_64, macOS arm64).

            Commit: `${{ github.sha }}`

            Files:
            - `signal-cli-qt-linux-x86_64` — plain executable
            - `signal-cli-qt-linux-x86_64-installer.tar.gz` — executable, per-user installer, and menu resources
            - `signal-cli-qt-<version>-1-x86_64.pkg.tar.zst` — Arch Linux package (`sudo pacman -U <file>`)
            - `signal-cli-qt-macos-arm64.dmg` — macOS (Apple Silicon) disk image
            - `signal-cli-qt-macos-arm64.app.zip` — macOS (Apple Silicon) app bundle as zip
            - `SHA256SUMS` — SHA-256 checksums for all files above

            `signal-cli` must be installed separately (on Arch e.g. from the AUR, on macOS e.g. `brew install signal-cli`).

            The macOS app is only ad-hoc signed (not notarized). On first launch use right-click → Open, or run
            `xattr -dr com.apple.quarantine /Applications/signal-cli-qt.app`.
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/signal-cli-qt-linux-x86_64
            dist/signal-cli-qt-linux-x86_64-installer.tar.gz
            dist/*.pkg.tar.zst
            dist/signal-cli-qt-macos-arm64.dmg
            dist/signal-cli-qt-macos-arm64.app.zip
            dist/SHA256SUMS
