name: Wren Release

on:
  push:
    branches:
      - main
      - master
      - macos-build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wren-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------
  # 1. Linux: Qt-App + Archiv mit vorhandenem Installer
  # --------------------------------------------------
  linux-build:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libqt6keychain1-dev \
            libssl-dev \
            libsecret-1-dev \
            libgl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrender-dev \
            libxcb1-dev \
            libxcb-glx0-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-shm0-dev \
            libxcb-icccm4-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-util-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust history store
        run: cargo test --manifest-path history-store/Cargo.toml

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Wren
        run: cmake --build build --parallel 2

      - name: Package Linux archive and installer
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/wren-linux-x86_64

          BIN=""
          for candidate in \
            build/wren \
            build/bin/wren \
            build/Wren \
            build/bin/Wren
          do
            if [ -f "$candidate" ]; then
              BIN="$candidate"
              break
            fi
          done

          if [ -z "$BIN" ]; then
            echo "::error::Could not find the Wren executable."
            find build -maxdepth 4 -type f -executable -print
            exit 1
          fi

          install -m 755 "$BIN" \
            dist/wren-linux-x86_64/wren

          # Find and include the existing installation script.
          INSTALL_SCRIPT=""
          for candidate in \
            install.sh \
            install-linux.sh \
            scripts/install.sh \
            scripts/install-linux.sh \
            packaging/install.sh \
            packaging/install-linux.sh
          do
            if [ -f "$candidate" ]; then
              INSTALL_SCRIPT="$candidate"
              break
            fi
          done

          if [ -z "$INSTALL_SCRIPT" ]; then
            echo "::error::No existing Linux install script was found."
            echo "Expected install.sh, install-linux.sh, scripts/ or packaging/."
            exit 1
          fi

          install -m 755 "$INSTALL_SCRIPT" \
            dist/wren-linux-x86_64/install.sh

          cp LICENSE dist/wren-linux-x86_64/LICENSE

          cat > dist/wren-linux-x86_64/README.txt <<'EOF'
          Wren for Linux x86_64

          Extract this archive and run the included installer:

            chmod +x install.sh
            ./install.sh

          The installer may require sudo privileges depending on its
          implementation.
          EOF

          tar -C dist \
            -czf dist/wren-linux-x86_64.tar.gz \
            wren-linux-x86_64

          test -s dist/wren-linux-x86_64.tar.gz

          ls -lh dist/wren-linux-x86_64.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: wren-linux-${{ github.sha }}
          path: dist/wren-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------
  # 2. Arch Linux package
  # --------------------------------------------------
  arch-package:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel

    steps:
      - name: Install Git and prerequisites
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git sudo

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare package source and PKGBUILD
        shell: bash
        run: |
          set -euo pipefail

          test -f packaging/arch/PKGBUILD
          test -f LICENSE

          VERSION="$(sed -nE \
            's/^[[:space:]]*project\(wren VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
            CMakeLists.txt | head -n1)"

          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
            echo "::warning::Could not determine the version from CMakeLists.txt; using $VERSION."
          fi

          REVISION="$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          PKGVER="${VERSION}.r${REVISION}.g${SHORT_SHA}"

          mkdir -p package-work dist

          git archive \
            --format=tar \
            --prefix="wren-${PKGVER}/" \
            HEAD | gzip > "package-work/wren-${PKGVER}.tar.gz"

          cp packaging/arch/PKGBUILD package-work/PKGBUILD

          sed -i \
            "s/^pkgver=.*/pkgver=${PKGVER}/" \
            package-work/PKGBUILD

          echo "PKGVER=${PKGVER}" >> "$GITHUB_ENV"

          cat package-work/PKGBUILD

      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail

          cd package-work

          # The PKGBUILD should use the local source archive.
          # Replace its source entry to match the archive generated above.
          sed -i \
            "s|^source=.*|source=(\"wren-${PKGVER}.tar.gz\")|" \
            PKGBUILD

          # Do not require a source checksum for this CI-generated archive.
          sed -i \
            '/^sha256sums=/c\sha256sums=("SKIP")' \
            PKGBUILD

          # Build as a non-root user, as required by makepkg.
          useradd --create-home builder || true
          chown -R builder:builder "$GITHUB_WORKSPACE/package-work"
          chown -R builder:builder "$GITHUB_WORKSPACE"

          su builder -c \
            "cd '$GITHUB_WORKSPACE/package-work' && makepkg --cleanbuild --syncdeps --noconfirm"

          find . -maxdepth 1 -name '*.pkg.tar.zst' -exec cp {} ../dist/ \;

          test -n "$(find ../dist -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"

      - name: Verify Arch package
        shell: bash
        run: |
          set -euo pipefail

          PKG="$(find dist -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
          pacman -Qip "$PKG"
          pacman -Qlp "$PKG"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: wren-arch-${{ github.sha }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------
  # 3. Native macOS app: Swift / SwiftUI
  # --------------------------------------------------
  macos-app:
    name: macOS Swift / SwiftUI
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust history store
        run: cargo test --manifest-path history-store/Cargo.toml

      - name: Build native macOS app
        run: |
          set -euo pipefail
          chmod +x macos/scripts/build-app.sh
          macos/scripts/build-app.sh

      - name: Run Swift tests
        run: swift test --package-path macos

      - name: Verify app bundle
        run: |
          set -euo pipefail
          test -d macos/build/Wren.app
          test -f macos/build/Wren.app/Contents/Info.plist

      - name: Package Swift app
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent \
            macos/build/Wren.app \
            dist/wren-macos-arm64.zip
          test -s dist/wren-macos-arm64.zip
          shasum -a 256 dist/wren-macos-arm64.zip \
            > dist/wren-macos-arm64.zip.sha256

      - name: Upload Swift app
        uses: actions/upload-artifact@v4
        with:
          name: wren-macos-${{ github.sha }}
          path: |
            dist/wren-macos-arm64.zip
            dist/wren-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------
  # 4. macOS Qt app
  # --------------------------------------------------
  macos-qt-app:
    name: macOS Qt
    runs-on: macos-26

    env:
      QTKEYCHAIN_VERSION: v0.14.0
      MACOSX_DEPLOYMENT_TARGET: '12.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install cmake ninja pkg-config librsvg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Test Rust history store
        run: cargo test --manifest-path history-store/Cargo.toml

      - name: Build QtKeychain
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            --branch "$QTKEYCHAIN_VERSION" \
            https://github.com/frankosterfeld/qtkeychain.git \
            "$RUNNER_TEMP/qtkeychain"

          cd "$RUNNER_TEMP/qtkeychain"

          # Fix the declaration used by this QtKeychain version if needed.
          if grep -qE '^[[:space:]]*bool isAvailable\(\)' \
            lib/keychain.h; then
            sed -i '' \
              's/^[[:space:]]*bool isAvailable()/bool QKeychain::isAvailable()/' \
              lib/keychain.h
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qtkeychain-install" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

          cmake --build build --parallel 2
          cmake --install build

      - name: Configure Qt app
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/qtkeychain-install"

      - name: Build Qt app
        run: cmake --build build --parallel 2

      - name: Create Qt app bundle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          BIN=""
          for candidate in \
            build/wren \
            build/bin/wren \
            build/Wren \
            build/bin/Wren
          do
            if [ -f "$candidate" ]; then
              BIN="$candidate"
              break
            fi
          done

          if [ -z "$BIN" ]; then
            echo "::error::Could not find the Wren Qt executable."
            find build -maxdepth 4 -type f -executable -print
            exit 1
          fi

          APP="dist/Wren-macos-qt.app"
          CONTENTS="$APP/Contents"

          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

          install -m 755 "$BIN" "$CONTENTS/MacOS/wren"

          cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Wren Qt</string>
            <key>CFBundleDisplayName</key>
            <string>Wren Qt</string>
            <key>CFBundleIdentifier</key>
            <string>org.wren.app.qt</string>
            <key>CFBundleExecutable</key>
            <string>wren</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          PLIST

          if [ -f packaging/wren.svg ]; then
            rsvg-convert -w 1024 -h 1024 \
              packaging/wren.svg \
              -o "$RUNNER_TEMP/wren-icon.png"

            mkdir -p "$RUNNER_TEMP/wren.iconset"

            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" \
                "$RUNNER_TEMP/wren-icon.png" \
                --out "$RUNNER_TEMP/wren.iconset/icon_${size}x${size}.png" \
                >/dev/null

              double=$((size * 2))
              sips -z "$double" "$double" \
                "$RUNNER_TEMP/wren-icon.png" \
                --out "$RUNNER_TEMP/wren.iconset/icon_${size}x${size}@2x.png" \
                >/dev/null
            done

            iconutil -c icns "$RUNNER_TEMP/wren.iconset" \
              -o "$CONTENTS/Resources/wren.icns"

            /usr/libexec/PlistBuddy \
              -c 'Add :CFBundleIconFile string wren' \
              "$CONTENTS/Info.plist"
          fi

      - name: Bundle Qt libraries and plugins
        shell: bash
        run: |
          set -euo pipefail

          APP="dist/Wren-macos-qt.app"
          EXECUTABLE="$APP/Contents/MacOS/wren"

          macdeployqt "$APP" \
            -always-overwrite \
            -libpath "$RUNNER_TEMP/qtkeychain-install/lib"

          # Ensure the macOS platform plugin is included.
          PLUGIN="$(find "$QT_ROOT_DIR" \
            -name libqcocoa.dylib -print -quit)"

          if [ -n "$PLUGIN" ]; then
            mkdir -p "$APP/Contents/PlugIns/platforms"
            cp "$PLUGIN" "$APP/Contents/PlugIns/platforms/"
          fi

          # Ensure the macOS style plugin is included when available.
          STYLE="$(find "$QT_ROOT_DIR" \
            -name libqmacstyle.dylib -print -quit)"

          if [ -n "$STYLE" ]; then
            mkdir -p "$APP/Contents/PlugIns/styles"
            cp "$STYLE" "$APP/Contents/PlugIns/styles/"
          fi

          # Include QtKeychain's shared library if it was built as a dylib.
          KEYCHAIN_LIB="$(find "$RUNNER_TEMP/qtkeychain-install" \
            -name '*qt*keychain*.dylib' -print -quit)"

          if [ -n "$KEYCHAIN_LIB" ]; then
            mkdir -p "$APP/Contents/Frameworks"
            cp "$KEYCHAIN_LIB" "$APP/Contents/Frameworks/"
          fi

          # Ad-hoc signing permits local testing but is not notarization.
          find "$APP/Contents" -type f -name '*.dylib' -print0 |
            while IFS= read -r -d '' lib; do
              codesign --force --sign - "$lib"
            done

          codesign --force --deep --sign - "$APP"

          codesign --verify --deep --strict "$APP"
          lipo -archs "$EXECUTABLE"

      - name: Package Qt app
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          ditto -c -k --keepParent \
            Wren-macos-qt.app \
            wren-macos-qt-arm64.zip

          test -s wren-macos-qt-arm64.zip
          unzip -l wren-macos-qt-arm64.zip

          shasum -a 256 wren-macos-qt-arm64.zip \
            > wren-macos-qt-arm64.zip.sha256

      - name: Upload Qt app
        uses: actions/upload-artifact@v4
        with:
          name: wren-macos-qt-${{ github.sha }}
          path: |
            dist/wren-macos-qt-arm64.zip
            dist/wren-macos-qt-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------
  # 5. Publish all four builds in one GitHub Release
  # --------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04

    needs:
      - linux-build
      - arch-package
      - macos-app
      - macos-qt-app

    # Publish automatically only from main/master.
    # workflow_dispatch on other branches still builds all artifacts.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wren-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          find . -maxdepth 1 -type f \
            ! -name SHA256SUMS \
            ! -name '*.sha256' \
            -printf '%f\n' |
            sort |
            while IFS= read -r file; do
              sha256sum "$file"
            done > SHA256SUMS

          cat SHA256SUMS
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Wren build ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/wren-linux-x86_64.tar.gz
            dist/*.pkg.tar.zst
            dist/wren-macos-arm64.zip
            dist/wren-macos-qt-arm64.zip
            dist/SHA256SUMS
