name: Build Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Least privilege: every job is read-only unless it grants itself write below
# (only the "release" job does).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.12.0"
  QT_VERSION_WINDOWS: "6.8"
  # Windows keeps a separately pinned corvus-cli build and SHA-256. The Flatpak job
  # resolves the latest published Linux release and calculates its SHA-256 at build time.
  CORVUS_CLI_COMMIT: "4d76022c8ff0d2e4bc42d8392c0762024dfa1db9"
  CORVUS_CLI_WINDOWS_SHA256: "124f6021d57ecbfcd8e2a24381aa189a47c558d6e59b1b21b22f0bc394e85001"

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --------------------------------------------------
      # System dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            file \
            curl \
            wget \
            ca-certificates \
            fuse3 \
            libfuse2t64 \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-util1 \
            libx11-xcb1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libegl1 \
            libopengl0 \
            libqrencode-dev \
            libhunspell-dev \
            qtkeychain-qt6-dev

      # --------------------------------------------------
      # Qt
      # --------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Configure Qt environment
        shell: bash
        run: |
          set -euo pipefail

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

          QMAKE_PATH="$(find "$QT_ROOT_DIR" \
            -type f -name qmake -print -quit)"

          if [ -z "$QMAKE_PATH" ]; then
            echo "::error::qmake not found in $QT_ROOT_DIR"
            exit 1
          fi

          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"
          "$QMAKE_PATH" --version

      # --------------------------------------------------
      # Rust
      # --------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch

      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail

          cargo test \
            --release \
            --locked \
            --manifest-path history-store/Cargo.toml

      # --------------------------------------------------
      # CMake
      # --------------------------------------------------
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      # --------------------------------------------------
      # Locate application executable
      # --------------------------------------------------
      - name: Locate executable
        shell: bash
        run: |
          set -euo pipefail

          find build -maxdepth 4 -type f -executable -print

          BINARY=""

          for candidate in \
            build/corvus \
            build/bin/corvus \
            build/Corvus \
            build/bin/Corvus
          do
            if [ -f "$candidate" ]; then
              BINARY="$candidate"
              break
            fi
          done

          if [ -z "$BINARY" ]; then
            echo "::error::Application binary not found. Check the CMake target name."
            exit 1
          fi

          echo "BINARY=$BINARY" >> "$GITHUB_ENV"
          file "$BINARY"

      # --------------------------------------------------
      # Linux installer tarball
      # --------------------------------------------------
      - name: Package installer
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          mkdir -p "$RUNNER_TEMP/corvus-installer"
          cp "$BINARY" "$RUNNER_TEMP/corvus-installer/corvus-linux-x86_64"
          chmod +x "$RUNNER_TEMP/corvus-installer/corvus-linux-x86_64"
          cp packaging/install.sh packaging/corvus.desktop packaging/corvus.svg \
            "$RUNNER_TEMP/corvus-installer/"
          chmod +x "$RUNNER_TEMP/corvus-installer/install.sh"
          tar -czf "$GITHUB_WORKSPACE/dist/corvus-linux-x86_64-installer.tar.gz" \
            -C "$RUNNER_TEMP/corvus-installer" .

      # --------------------------------------------------
      # Validate output and checksums
      # --------------------------------------------------
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/corvus-linux-x86_64-installer.tar.gz

          tar -tzf dist/corvus-linux-x86_64-installer.tar.gz

          (
            cd dist
            sha256sum \
              corvus-linux-x86_64-installer.tar.gz \
              > SHA256SUMS
          )

          cat dist/SHA256SUMS
          ls -lh dist

      # --------------------------------------------------
      # Preserve artifacts even when a later step fails
      # --------------------------------------------------
      - name: Upload build artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corvus-linux-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14


  # ------------------------------------------------------
  # Arch Linux package (built natively in an Arch container)
  # ------------------------------------------------------
  arch-package:
    name: Build Arch Linux package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel

    steps:
      # git must exist before checkout so that the full history is cloned
      - name: Install git
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Prepare source tarball and PKGBUILD
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            base="${GITHUB_REF_NAME#v}"
          else
            base="$(sed -n 's/^project(corvus VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          fi
          count="$(git rev-list --count HEAD)"
          short="$(git rev-parse --short=7 HEAD)"
          pkgver="${base}.r${count}.g${short}"
          echo "PKGVER=$pkgver" >> "$GITHUB_ENV"

          # makepkg refuses to run as root
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

          build_dir=/home/builder/pkg
          mkdir -p "$build_dir"

          git archive --format=tar.gz \
            --prefix="corvus-${pkgver}/" \
            -o "$build_dir/corvus-${pkgver}.tar.gz" HEAD
          cp packaging/arch/PKGBUILD "$build_dir/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" "$build_dir/PKGBUILD"

          chown -R builder:builder /home/builder
          cat "$build_dir/PKGBUILD"

      - name: Build package
        shell: bash
        run: |
          set -euxo pipefail
          su builder -c 'cd ~/pkg && makepkg --syncdeps --noconfirm --nocolor'

      - name: Inspect package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp /home/builder/pkg/*.pkg.tar.zst dist/

          for pkg in dist/*.pkg.tar.zst; do
            pacman -Qip "$pkg"
            pacman -Qlp "$pkg"
          done

          # the package must contain the executable, desktop entry, icon and license
          files="$(pacman -Qlp dist/*.pkg.tar.zst)"
          for path in \
            /usr/bin/corvus \
            /usr/share/applications/corvus.desktop \
            /usr/share/icons/hicolor/scalable/apps/corvus.svg \
            /usr/share/licenses/corvus/LICENSE
          do
            if ! grep -qxF "corvus $path" <<< "$files"; then
              echo "::error::Package is missing $path"
              exit 1
            fi
          done

      - name: Upload Arch package artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corvus-arch-${{ github.sha }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # Flatpak (KDE runtime, sandboxed, ships corvus-cli and qrencode)
  # ------------------------------------------------------
  flatpak:
    name: Build Flatpak (x86_64)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    env:
      FLATPAK_APP_ID: io.github.ada_h00k.Corvus
      FLATPAK_MANIFEST: packaging/flatpak/io.github.ada_h00k.Corvus.yml
      # https://github.com/flatpak/flatpak-builder-tools (cargo/flatpak-cargo-generator.py)
      CARGO_GENERATOR_REF: 74697c75b630d7330e77250fc13cb5ea688d9479

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The app source is this repository's own release tag. A commit SHA cannot
      # pin the commit containing the manifest itself, so resolve the release tag directly.
      - name: Pin Corvus source to release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("packaging/flatpak/io.github.ada_h00k.Corvus.yml")
          lines = manifest.read_text().splitlines()

          start = lines.index("  - name: corvus")
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("  - name: ")),
              len(lines),
          )
          module = lines[start:end]
          source_url = "        url: https://github.com/ada-h00k/Corvus.git"
          url_index = module.index(source_url)
          tag_index = next(
              i for i in range(url_index + 1, len(module))
              if module[i].startswith("        tag: ")
          )

          module[tag_index] = f"        tag: {os.environ['GITHUB_REF_NAME']}"
          if tag_index + 1 < len(module) and module[tag_index + 1].startswith("        commit: "):
              del module[tag_index + 1]

          lines[start:end] = module
          manifest.write_text("\n".join(lines) + "\n")
          PY

      # Resolve the newest published corvus-cli release and pin it in the manifest: releases
      # are tagged "v<semver>" (legacy releases used "commit-<sha>"). This step resolves the
      # tag to the commit it points at and refreshes the pinned tag and commit per build.
      - name: Pin latest corvus-cli commit
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import json
          import re
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          api = "https://api.github.com/repos/ada-h00k/corvus-cli/releases/latest"
          request = urllib.request.Request(
              api,
              headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Corvus-Flatpak-build",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)

          tag = release["tag_name"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+|commit-[0-9a-f]{40}", tag):
              raise SystemExit(
                  f"Unexpected corvus-cli release tag {tag!r}, "
                  "expected 'v<semver>' or 'commit-<sha>'"
              )

          # Resolve the tag to the commit it points at (peeled ref first, so annotated
          # tags resolve to their commit instead of the tag object).
          def resolved_commit(ref):
              out = subprocess.run(
                  ["git", "ls-remote", "https://github.com/ada-h00k/corvus-cli.git", ref],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout.strip()
              return out.split()[0] if out else ""

          commit = (
              resolved_commit(f"refs/tags/{tag}^{{}}")
              or resolved_commit(f"refs/tags/{tag}")
          )
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit(f"Could not resolve the commit for tag {tag!r}")

          # Guard: the Flatpak build runs `cargo build --offline --locked`, so the
          # Cargo.lock committed at the release tag must already match Cargo.toml.
          # A release tagged without a lock sync (e.g. a version bump that forgot
          # `cargo check`) fails only much later, deep inside the flatpak build with
          # cargo's "cannot update the lock file because --locked was passed".
          # Validate the cheap-to-check invariants here and fail with a clear message.
          def fetch_raw(path):
              url = f"https://raw.githubusercontent.com/ada-h00k/corvus-cli/{commit}/{path}"
              request = urllib.request.Request(url, headers={"User-Agent": "Corvus-Flatpak-build"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.read().decode()
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"corvus-cli {tag}: could not fetch {path} at {commit[:12]}: {error}")

          manifest_toml = fetch_raw("Cargo.toml")
          lock_toml = fetch_raw("Cargo.lock")

          def toml_section(text, section):
              match = re.search(rf"(?ms)^\[{re.escape(section)}\]\s*$(.*?)(?=^\[|\Z)", text)
              return match.group(1) if match else ""

          own = re.search(r"(?m)^version = \"([^\"]+)\"", toml_section(manifest_toml, "package"))
          locked = re.search(
              r'(?m)^\[\[package\]\]\s*\nname = "corvus-cli"\s*\nversion = "([^"]+)"',
              lock_toml,
          )
          if locked is None or own is None or locked.group(1) != own.group(1):
              raise SystemExit(
                  f"corvus-cli {tag}: Cargo.lock is stale - Cargo.toml declares version "
                  f"{own.group(1) if own else '?'} but the lock file pins "
                  f"{locked.group(1) if locked else 'nothing'}. Run `cargo check` in the "
                  "corvus-cli repo, commit the regenerated Cargo.lock and re-tag/release."
              )

          # every direct dependency and every [patch.*] target must exist in the lock
          declared = set()
          for section in ("dependencies", "dev-dependencies", "build-dependencies"):
              declared |= set(re.findall(r"(?m)^([\w-]+)\s*=", toml_section(manifest_toml, section)))
          for match in re.finditer(r"(?ms)^\[patch[^]]*\]\s*$(.*?)(?=^\[|\Z)", manifest_toml):
              declared |= set(re.findall(r"(?m)^([\w-]+)\s*=", match.group(1)))
          locked_names = set(re.findall(r'(?m)^name = "([\w-]+)"', lock_toml))
          missing = sorted(declared - locked_names)
          if missing:
              raise SystemExit(
                  f"corvus-cli {tag}: Cargo.lock does not contain {', '.join(missing)} - the "
                  "lock is out of sync with Cargo.toml. Run `cargo check` in the corvus-cli "
                  "repo, commit the regenerated Cargo.lock and re-tag/release."
              )

          manifest = Path("packaging/flatpak/io.github.ada_h00k.Corvus.yml")
          content = manifest.read_text()
          content, tag_count = re.subn(
              r"(  - name: corvus-cli\n.*?        tag: )\S+",
              r"\g<1>" + tag,
              content,
              count=1,
              flags=re.DOTALL,
          )
          content, commit_count = re.subn(
              r"(  - name: corvus-cli\n.*?        commit: )[0-9a-f]{40}",
              r"\g<1>" + commit,
              content,
              count=1,
              flags=re.DOTALL,
          )
          if (tag_count, commit_count) != (1, 1):
              raise SystemExit("Could not locate the corvus-cli source in the Flatpak manifest")
          manifest.write_text(content)

          print(f"Building corvus-cli from source at: {tag} ({commit[:12]})")
          PY

      - name: Install Flatpak tooling
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            appstream \
            desktop-file-utils \
            python3-venv

          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

          flatpak --version
          flatpak-builder --version

          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      # The Flatpak build has no network access: all crates of the Rust history store and of
      # corvus-cli are vendored from Cargo.lock into *cargo-sources.json (kept out of git,
      # always in sync).
      - name: Generate Cargo sources
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv "$RUNNER_TEMP/cargo-gen"
          "$RUNNER_TEMP/cargo-gen/bin/pip" install --quiet aiohttp tomlkit PyYAML

          curl -fsSL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${CARGO_GENERATOR_REF}/cargo/flatpak-cargo-generator.py"

          # Keep multiple Git refs from one repository in separate Cargo sources.
          # Also avoid copying read-only .git metadata from Flatpak's source checkout.
          python3 packaging/flatpak/patch-cargo-generator.py "$RUNNER_TEMP/flatpak-cargo-generator.py"

          "$RUNNER_TEMP/cargo-gen/bin/python" "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            history-store/Cargo.lock \
            -o packaging/flatpak/cargo-sources.json

          test -s packaging/flatpak/cargo-sources.json

          # corvus-cli is built from source: vendor its crates from the Cargo.lock at the
          # commit pinned in the manifest (refreshed by "Pin latest corvus-cli commit").
          python3 - <<'PY' > "$RUNNER_TEMP/corvus-cli-commit.txt"
          import re
          from pathlib import Path

          content = Path("packaging/flatpak/io.github.ada_h00k.Corvus.yml").read_text()
          match = re.search(
              r"  - name: corvus-cli\n.*?        commit: ([0-9a-f]{40})",
              content,
              re.DOTALL,
          )
          if match is None:
              raise SystemExit("Could not locate the corvus-cli commit in the Flatpak manifest")
          print(match.group(1))
          PY
          CORVUS_CLI_COMMIT=$(cat "$RUNNER_TEMP/corvus-cli-commit.txt")

          curl -fsSL -o packaging/flatpak/corvus-cli-Cargo.lock \
            "https://raw.githubusercontent.com/ada-h00k/corvus-cli/${CORVUS_CLI_COMMIT}/Cargo.lock"

          "$RUNNER_TEMP/cargo-gen/bin/python" "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            packaging/flatpak/corvus-cli-Cargo.lock \
            -o packaging/flatpak/corvus-cli-cargo-sources.json

          test -s packaging/flatpak/corvus-cli-cargo-sources.json

      - name: Cache Flatpak sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .flatpak-builder/downloads
          key: flatpak-sources-${{ hashFiles('packaging/flatpak/*.yml', 'packaging/flatpak/*.patch', 'packaging/flatpak/*.py', 'packaging/flatpak/corvus-cli-Cargo.lock', 'history-store/Cargo.lock') }}
          restore-keys: |
            flatpak-sources-

      - name: Build Flatpak
        shell: bash
        run: |
          set -euxo pipefail

          flatpak-builder \
            --user \
            --force-clean \
            --install-deps-from=flathub \
            --default-branch=stable \
            --repo=flatpak-repo \
            flatpak-build \
            "$FLATPAK_MANIFEST"

      # --------------------------------------------------
      # Validate metadata and the sandbox permissions
      # --------------------------------------------------
      - name: Validate desktop file and AppStream metadata
        shell: bash
        run: |
          set -euxo pipefail

          files=flatpak-build/files/share
          desktop="$files/applications/$FLATPAK_APP_ID.desktop"
          metainfo="$files/metainfo/$FLATPAK_APP_ID.metainfo.xml"
          icon="$files/icons/hicolor/scalable/apps/$FLATPAK_APP_ID.svg"

          test -s "$desktop"
          test -s "$metainfo"
          test -s "$icon"

          desktop-file-validate "$desktop"
          grep -qx "Icon=$FLATPAK_APP_ID" "$desktop"
          appstreamcli validate --no-net "$metainfo"

      - name: Check sandbox permissions
        shell: bash
        run: |
          set -euo pipefail

          cat flatpak-build/metadata

          # The app metadata inherits the [Context] of the runtime: flatpak build-init seeds
          # the build directory with a copy of the runtime metadata, and flatpak build-finish
          # merges the finish-args into that inherited context. On the KDE runtime this pulls
          # the plain "x11" socket (used by fallback-x11 only when Wayland is unavailable),
          # the KDE bus names in [Session Bus Policy] and the default
          # "xdg-config/kdeglobals:ro" file system entry into the metadata, next to the
          # sockets and entries requested by the manifest.
          #
          # Accepted beyond the finish-args: those runtime-inherited entries.
          # (Notification sounds are played in-process via the PulseAudio socket, so no
          # PipeWire socket is needed.) Everything else — a real x11 socket without
          # the fallback marker, broad devices, extra sockets, bus access or file system
          # access — fails the build. (If one is ever needed on purpose, adjust the patterns.)
          forbidden='^filesystems=|^devices=.*all|^sockets=(.*;)?x11;|^sockets=.*(ssh-auth|pcsc|cups|gpg-agent|system-bus)|^org\.freedesktop\.Flatpak=|=own$|^\[System Bus Policy\]'
          # Strip the accepted file system entry (flatpak merges everything into one
          # "filesystems=" line) and, on sockets lines that carry the "fallback-x11" marker,
          # the runtime-inherited bare "x11" token (a real x11 grant never has that marker).
          checked="$(
            sed -e '/^filesystems=/{s|xdg-config/kdeglobals:ro;||g; /^filesystems=;*$/d;}' \
                -e '/^sockets=.*fallback-x11;/{s|fallback-x11|FALLBACK_X11_TMP|g; s|x11;||g; s|FALLBACK_X11_TMP|fallback-x11|g;}' \
                flatpak-build/metadata
          )"
          if grep -E "$forbidden" <<< "$checked"; then
            echo "::error::The Flatpak requests more permissions than intended. See the metadata above."
            exit 1
          fi

      # --------------------------------------------------
      # Bundle
      # --------------------------------------------------
      - name: Create Flatpak bundle
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            dist/corvus-linux-x86_64.flatpak \
            "$FLATPAK_APP_ID" \
            stable

          test -s dist/corvus-linux-x86_64.flatpak
          ls -lh dist

      # --------------------------------------------------
      # Self-contained archive for FlatPark (https://flatpark.org)
      #
      # FlatPark does not build apps and does not accept .flatpak bundles: it downloads
      # one official release file at install time and unpacks it into /app/extra. This
      # archive is the /app tree of the build above (corvus, corvus-cli, qrencode, the
      # libraries from libsecret/qtkeychain, desktop file, icon, metainfo, license), so
      # it contains everything that is not in the KDE runtime. The file name is the same
      # for every release.
      # --------------------------------------------------
      - name: Create FlatPark release archive
        shell: bash
        run: |
          set -euxo pipefail

          stage="$RUNNER_TEMP/flatpark-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -a flatpak-build/files/. "$stage/"
          rm -f "$stage/manifest.json"

          # Remove build-time files that are not needed at runtime.
          rm -rf \
            "$stage/lib/debug" \
            "$stage/include" \
            "$stage/lib64" \
            "$stage/mkspecs"

          runtime_version="$(sed -n "s/^runtime-version: '\\(.*\\)'/\\1/p" "$FLATPAK_MANIFEST")"
          cat > "$stage/BUILD-INFO" <<EOF
          app-id=$FLATPAK_APP_ID
          version=$GITHUB_REF_NAME
          commit=$GITHUB_SHA
          runtime=org.kde.Platform//$runtime_version
          EOF

          for path in \
            bin/corvus \
            bin/corvus-cli \
            bin/qrencode \
            "share/applications/$FLATPAK_APP_ID.desktop" \
            "share/metainfo/$FLATPAK_APP_ID.metainfo.xml" \
            "share/icons/hicolor/scalable/apps/$FLATPAK_APP_ID.svg" \
            "share/licenses/$FLATPAK_APP_ID/LICENSE"
          do
            test -e "$stage/$path" || { echo "::error::$path is missing in the FlatPark archive"; exit 1; }
          done

          mkdir -p dist
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" \
            -czf dist/corvus-linux-x86_64-flatpark.tar.gz -C "$stage" .

          tar -tzf dist/corvus-linux-x86_64-flatpark.tar.gz
          ls -lh dist

      # The archive is unpacked to /app/extra at install time, not to /app. Check in a bare
      # KDE SDK sandbox (nothing in /app) that the binaries find their libraries from the
      # archive alone when LD_LIBRARY_PATH points at its lib/ directory.
      - name: Smoke test FlatPark archive outside /app
        shell: bash
        run: |
          set -euxo pipefail

          extra="$RUNNER_TEMP/corvus-extra"
          rm -rf "$extra"
          mkdir -p "$extra"
          tar -xzf dist/corvus-linux-x86_64-flatpark.tar.gz -C "$extra"

          runtime_version="$(sed -n "s/^runtime-version: '\\(.*\\)'/\\1/p" "$FLATPAK_MANIFEST")"
          flatpak build-init "$RUNNER_TEMP/flatpark-test" io.github.ada_h00k.FlatparkTest \
            org.kde.Sdk org.kde.Platform "$runtime_version"

          flatpak build --filesystem="$extra:ro" "$RUNNER_TEMP/flatpark-test" \
            sh -c '
              set -eu
              export LD_LIBRARY_PATH="$1/lib"
              export PATH="$1/bin:$PATH"
              for exe in corvus corvus-cli qrencode; do
                missing="$(ldd "$1/bin/$exe" | grep "not found" || true)"
                if [ -n "$missing" ]; then
                  echo "$exe: $missing"
                  exit 1
                fi
              done
              corvus-cli --version
              qrencode -V
            ' sh "$extra"

      # Install the bundle like a user would and check that everything it ships actually runs
      - name: Smoke test installed Flatpak
        shell: bash
        run: |
          set -euxo pipefail

          flatpak install --user --noninteractive --bundle dist/corvus-linux-x86_64.flatpak

          # effective permissions of the installed app
          flatpak info --user --show-permissions "$FLATPAK_APP_ID"

          flatpak run --command=corvus-cli "$FLATPAK_APP_ID" --version
          flatpak run --command=qrencode "$FLATPAK_APP_ID" -V

          # every shared library of the executable must be found inside the sandbox
          flatpak run --command=sh "$FLATPAK_APP_ID" -c '
            missing="$(ldd /app/bin/corvus | grep "not found" || true)"
            if [ -n "$missing" ]; then
              echo "$missing"
              exit 1
            fi
          '

          # corvus-cli has to be found by Corvus through PATH, and all its shared libraries
          # must be available inside the sandbox
          flatpak run --command=sh "$FLATPAK_APP_ID" -c '
            command -v corvus-cli
            missing="$(ldd "$(command -v corvus-cli)" | grep "not found" || true)"
            if [ -n "$missing" ]; then
              echo "$missing"
              exit 1
            fi
          '

      # The unsigned OSTree repository for the Pages job (only if publishing is enabled).
      # It is signed there, so the signing key never reaches the job that builds the code.
      - name: Pack OSTree repository
        if: vars.FLATPAK_REPO_PUBLISH == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          tar -C flatpak-repo -cf flatpak-repo.tar .
          ls -lh flatpak-repo.tar

      - name: Upload OSTree repository
        if: vars.FLATPAK_REPO_PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flatpak-repo-${{ github.sha }}
          path: flatpak-repo.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload Flatpak artifact
        if: always() && hashFiles('dist/*.flatpak') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corvus-flatpak-${{ github.sha }}
          path: |
            dist/*.flatpak
            dist/corvus-linux-x86_64-flatpark.tar.gz
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # Linux AppImage (x86_64): like the Flatpak it brings everything with it:
  # Qt, corvus-cli, qrencode, libhunspell and the Hunspell dictionaries
  # ------------------------------------------------------
  appimage:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Qt libraries come from the Qt installer below, not from apt, so no Qt packages
      # (and no QtKeychain package, which is built against the distribution's Qt) are installed.
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            file \
            curl \
            ca-certificates \
            zsync \
            xvfb \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-util1 \
            libx11-xcb1 \
            libdbus-1-dev \
            libfontconfig1 \
            libfreetype6 \
            libegl1 \
            libopengl0 \
            libsecret-1-dev \
            libhunspell-dev \
            fonts-noto-color-emoji \
            breeze-icon-theme \
            qrencode

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Configure Qt environment
        shell: bash
        run: |
          set -euo pipefail

          QMAKE_PATH="$(find "$QT_ROOT_DIR" -type f -name qmake -print -quit)"
          if [ -z "$QMAKE_PATH" ]; then
            echo "::error::qmake not found in $QT_ROOT_DIR"
            exit 1
          fi

          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"
          "$QMAKE_PATH" --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch

      # Same QtKeychain as the Flatpak, built against the Qt above so that the bundled
      # Qt libraries are the only ones in the AppImage.
      - name: Build QtKeychain
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch 0.17.0 \
            https://github.com/frankosterfeld/qtkeychain.git \
            "$RUNNER_TEMP/qtkeychain-src"

          cmake \
            -S "$RUNNER_TEMP/qtkeychain-src" \
            -B "$RUNNER_TEMP/qtkeychain-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qtkeychain-install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TEST_APPLICATION=OFF

          cmake --build "$RUNNER_TEMP/qtkeychain-build" --parallel
          cmake --install "$RUNNER_TEMP/qtkeychain-build"

          echo "QTKEYCHAIN_PREFIX=$RUNNER_TEMP/qtkeychain-install" >> "$GITHUB_ENV"

      - name: Configure and build Corvus
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-appimage \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$QTKEYCHAIN_PREFIX"

          cmake --build build-appimage --parallel

          rm -rf AppDir
          DESTDIR="$PWD/AppDir" cmake --install build-appimage

      # corvus-cli, qrencode, libhunspell, the dictionaries and the Qt libraries/plugins
      # are added by the script; it also checks that the bundle is complete.
      - name: Build AppImage
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p dist
          APPDIR="$PWD/AppDir" \
          OUTPUT="$PWD/dist/corvus-linux-x86_64.AppImage" \
          EXTRA_LIB_PATH="$QTKEYCHAIN_PREFIX/lib" \
          TOOLS_DIR="$RUNNER_TEMP/appimage-tools" \
            bash packaging/appimage/build-appimage.sh

      # Start the real AppImage under a virtual display. It has no account and no keyring,
      # so it is expected to keep running (the step stops it after 15 s); what must not
      # happen is a crash or a missing library / Qt plugin.
      - name: Smoke test AppImage
        shell: bash
        run: |
          set -uo pipefail

          export APPIMAGE_EXTRACT_AND_RUN=1
          export HOME="$RUNNER_TEMP/appimage-home"
          mkdir -p "$HOME"

          set +e
          timeout 15 xvfb-run -a dist/corvus-linux-x86_64.AppImage > "$RUNNER_TEMP/appimage-smoke.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/appimage-smoke.log"

          if grep -E -i "error while loading shared libraries|could not load the qt platform plugin|cannot open shared object" "$RUNNER_TEMP/appimage-smoke.log"; then
            echo "::error::The AppImage is missing a library or a Qt plugin"
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "::error::The AppImage exited with status $status"
            exit 1
          fi

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/corvus-linux-x86_64.AppImage
          test -s dist/corvus-linux-x86_64.AppImage.zsync
          file dist/corvus-linux-x86_64.AppImage
          ./dist/corvus-linux-x86_64.AppImage --appimage-updateinformation

          ./dist/corvus-linux-x86_64.AppImage --appimage-extract 'usr/bin/*' > /dev/null
          squashfs-root/usr/bin/corvus-cli --version
          squashfs-root/usr/bin/qrencode -V
          rm -rf squashfs-root

          ls -lh dist

      - name: Upload build artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corvus-appimage-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # macOS app (Swift / SwiftUI, Apple silicon)
  # ------------------------------------------------------
  macos-app:
    name: Build macOS app (arm64)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch

      # Builds the Rust history store, the Swift package and the .app bundle
      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          macos/scripts/build-app.sh

      - name: Run Swift tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path macos

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          ditto -c -k --keepParent "macos/build/Corvus.app" dist/corvus-macos-arm64.zip

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/corvus-macos-arm64.zip
          unzip -l dist/corvus-macos-arm64.zip
          codesign --verify --deep --strict --verbose "macos/build/Corvus.app"
          file "macos/build/Corvus.app/Contents/MacOS/corvus"
          ls -lh dist

          # Files created by the app must be quarantined; corvus-cli runs through the helper app.
          packaging/macos/check-signal-cli-helper.sh macos/build/Corvus.app

      - name: Upload build artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corvus-macos-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # macOS Qt app (Qt, Apple silicon)
  # ------------------------------------------------------
  macos-qt-app:
    name: Build Qt macOS app (arm64)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install cmake ninja pkgconf qrencode

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Configure Homebrew dependency paths
        shell: bash
        run: |
          set -euo pipefail

          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix qrencode)/lib/pkgconfig:$(brew --prefix libpng)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
            >> "$GITHUB_ENV"

      # Build QtKeychain against the same Qt installation as the application.
      - name: Build QtKeychain
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch 0.17.0 \
            https://github.com/frankosterfeld/qtkeychain.git \
            "$RUNNER_TEMP/qtkeychain-src"

          cmake \
            -S "$RUNNER_TEMP/qtkeychain-src" \
            -B "$RUNNER_TEMP/qtkeychain-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qtkeychain-install" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TEST_APPLICATION=OFF

          cmake --build "$RUNNER_TEMP/qtkeychain-build" --parallel
          cmake --install "$RUNNER_TEMP/qtkeychain-build"

          echo "QTKEYCHAIN_PREFIX=$RUNNER_TEMP/qtkeychain-install" \
            >> "$GITHUB_ENV"

      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail

          cargo test \
            --release \
            --locked \
            --manifest-path history-store/Cargo.toml

      - name: Configure Qt CMake build
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-qt \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$QTKEYCHAIN_PREFIX;$HOMEBREW_PREFIX"

      - name: Build Qt application
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-qt --parallel

      - name: Deploy Qt frameworks and plugins
        shell: bash
        run: |
          set -euxo pipefail

          # By name: build-qt also contains the helper bundle (corvus-signal-cli.app).
          APP_PATH=build-qt/corvus.app

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app bundle found. Check the CMake executable target and MACOSX_BUNDLE setting."
            exit 1
          fi

          APP_PATH="$(cd "$(dirname "$APP_PATH")" && pwd)/$(basename "$APP_PATH")"

          "$QT_ROOT_DIR/bin/macdeployqt" "$APP_PATH" \
            -always-overwrite \
            -codesign=- \
            -verbose=2 \
            -libpath="$QTKEYCHAIN_PREFIX/lib" \
            -libpath="$(brew --prefix qrencode)/lib" \
            -libpath="$(brew --prefix libpng)/lib"

          echo "QT_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package and verify Qt app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          test -d "$QT_APP_PATH"
          test -s "$QT_APP_PATH/Contents/Info.plist"

          codesign --verify --deep --strict --verbose=2 "$QT_APP_PATH"

          # Files created by the app must be quarantined; corvus-cli runs through the helper app.
          packaging/macos/check-signal-cli-helper.sh "$QT_APP_PATH"

          find "$QT_APP_PATH/Contents/MacOS" \
            -maxdepth 1 -type f -exec file {} \;

          ditto -c -k --keepParent \
            "$QT_APP_PATH" \
            dist/corvus-qt-macos-arm64.zip

          test -s dist/corvus-qt-macos-arm64.zip
          unzip -l dist/corvus-qt-macos-arm64.zip
          ls -lh dist

      - name: Upload Qt macOS artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corvus-qt-macos-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # Windows (Qt, x86_64): English setup with corvus-cli bundled
  # ------------------------------------------------------
  windows-app:
    name: Build Windows x86_64 (Qt + setup)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      # Git for Windows ships GNU "link.exe" (usr\bin), which shadows the MSVC linker in bash
      # steps and breaks Rust/CMake links ("/usr/bin/link: extra operand"). Remove it.
      - name: Remove GNU link.exe
        shell: pwsh
        run: |
          $gnu = 'C:\Program Files\Git\usr\bin\link.exe'
          if (Test-Path $gnu) { Remove-Item $gnu -Force }
          (Get-Command link.exe -All).Source

      # Qt 6.12.0 is listed by aqtinstall but its Windows (MSVC) packages are not downloadable
      # ("Failed to locate XML data"). The Windows build therefore uses the 6.8 LTS series.
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          host: windows
          target: desktop
          modules: qtmultimedia
          cache: true

      # QtKeychain uses the Windows Credential Manager. Built against the same Qt.
      - name: Build QtKeychain
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch 0.17.0 \
            https://github.com/frankosterfeld/qtkeychain.git \
            "$RUNNER_TEMP/qtkeychain-src"

          cmake \
            -S "$RUNNER_TEMP/qtkeychain-src" \
            -B "$RUNNER_TEMP/qtkeychain-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$RUNNER_TEMP")/qtkeychain-install" \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_ROOT_DIR")" \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TEST_APPLICATION=OFF

          cmake --build "$RUNNER_TEMP/qtkeychain-build" --parallel
          cmake --install "$RUNNER_TEMP/qtkeychain-build"

          echo "QTKEYCHAIN_PREFIX=$(cygpath -m "$RUNNER_TEMP")/qtkeychain-install" >> "$GITHUB_ENV"

      # qrencode.exe is used to show the QR code when linking a device. Statically linked,
      # so a single .exe. It is part of the setup; the build fails
      # if it cannot be built or does not work.
      - name: Build qrencode
        shell: bash
        run: |
          set -euxo pipefail

          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "libqrencode[tool]:x64-windows-static"

          ROOT="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static"
          QR="$(find "$ROOT" -iname qrencode.exe -print -quit)"
          if [ -z "$QR" ]; then
            echo "::error::vcpkg did not produce qrencode.exe"
            exit 1
          fi

          OUT="$RUNNER_TEMP/qrencode"
          mkdir -p "$OUT"
          cp "$QR" "$OUT/qrencode.exe"

          # Smoke test, same call as src/LinkDialog.cpp: PNG written to a file. (Not to stdout:
          # qrencode.exe does not switch stdout to binary mode on Windows, which would turn
          # 0A into 0D0A and corrupt the PNG.)
          "$OUT/qrencode.exe" -V
          "$OUT/qrencode.exe" -t PNG -s 6 -m 2 -o "$OUT/test.png" \
            "sgnl://linkdevice?uuid=ci-test&pub_key=ci-test"
          sig="$(head -c 8 "$OUT/test.png" | od -An -tx1 | tr -d ' \n')"
          if [ "$sig" != "89504e470d0a1a0a" ]; then
            echo "::error::qrencode.exe did not write a valid PNG (signature: $sig)"
            exit 1
          fi
          rm -f "$OUT/test.png"

          # libqrencode is LGPL-2.1+: ship its license text with the binary
          LIC="$(find "$ROOT/share/libqrencode" -iname copyright -print -quit 2>/dev/null || true)"
          if [ -n "$LIC" ]; then
            cp "$LIC" "$OUT/libqrencode-COPYING.txt"
          else
            echo "::warning::libqrencode license file not found in vcpkg"
          fi

          echo "QRENCODE_EXE=$(cygpath -m "$OUT")/qrencode.exe" >> "$GITHUB_ENV"
          echo "QRENCODE_LICENSE=$(cygpath -m "$OUT")/libqrencode-COPYING.txt" >> "$GITHUB_ENV"

      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path history-store/Cargo.toml

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_ROOT_DIR");$QTKEYCHAIN_PREFIX"

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Deploy Qt runtime
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p stage
          cp build/corvus.exe stage/

          # QtKeychain DLL (name differs between versions)
          find "$QTKEYCHAIN_PREFIX" -iname 'qt*keychain*.dll' -exec cp {} stage/ \;
          ls stage

          # windeployqt treats "qt6keychain.dll" as a Qt module and looks for it in Qt's bin
          # directory, so make it available there.
          find "$QTKEYCHAIN_PREFIX" -iname 'qt*keychain*.dll' -exec cp {} "$QT_ROOT_DIR/bin/" \;

          windeployqt --release --no-translations --compiler-runtime \
            --dir stage stage/corvus.exe

          # the keychain DLL must be next to corvus.exe, whatever windeployqt did with it
          find "$QTKEYCHAIN_PREFIX" -iname 'qt*keychain*.dll' -exec cp {} stage/ \;

          # qrencode.exe next to corvus.exe (src/LinkDialog.cpp looks there first)
          test -f "$QRENCODE_EXE"
          cp "$QRENCODE_EXE" stage/qrencode.exe
          if [ -f "$QRENCODE_LICENSE" ]; then
            mkdir -p stage/licenses
            cp "$QRENCODE_LICENSE" stage/licenses/libqrencode-COPYING.txt
          fi

          find stage -maxdepth 1 -type f | sort

      # corvus-cli: a single native exe (no Java) plus the OpenSSL DLL it
      # links dynamically. Both go to <app>\corvus-cli\, where Corvus looks first
      # (SignalCli::autodetect). The build fails if the download does not match the pinned hash
      # or the program does not start.
      - name: Bundle corvus-cli
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $base = "https://github.com/ada-h00k/corvus-cli/releases/download/commit-$env:CORVUS_CLI_COMMIT"
          $zip  = Join-Path $env:RUNNER_TEMP 'corvus-cli-windows-x86_64.zip'

          $ok = $false
          foreach ($attempt in 1..4) {
            try {
              Invoke-WebRequest -Uri "$base/corvus-cli-windows-x86_64.zip" -OutFile $zip -UseBasicParsing
              $ok = $true
              break
            } catch {
              Write-Host "Download attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (-not $ok) { throw 'corvus-cli could not be downloaded' }

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:CORVUS_CLI_WINDOWS_SHA256) {
            throw "corvus-cli SHA-256 mismatch: expected $env:CORVUS_CLI_WINDOWS_SHA256, got $hash"
          }

          $dest = 'stage\corvus-cli'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          foreach ($f in 'corvus-cli.exe', 'libcrypto-3-x64.dll') {
            if (-not (Test-Path (Join-Path $dest $f))) { throw "$f is missing in the corvus-cli archive" }
          }

          # corvus-cli is AGPL-3.0 (source: github.com/ada-h00k/corvus-cli): ship its license
          New-Item -ItemType Directory -Force -Path 'stage\licenses' | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://raw.githubusercontent.com/ada-h00k/corvus-cli/$env:CORVUS_CLI_COMMIT/LICENSE" `
            -OutFile 'stage\licenses\corvus-cli-LICENSE.txt'

          # Smoke test: starts and finds its DLL
          $out = & (Join-Path $dest 'corvus-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'corvus-cli.exe does not run' }
          Write-Host $out

      - name: Build setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            # CMake now passes the version through ${CORVUS_VERSION} to project(),
            # so read the default version declaration rather than the project() line.
            $versionMatch = Select-String -Path CMakeLists.txt -Pattern '^\s*set\(CORVUS_VERSION\s+"([0-9]+\.[0-9]+\.[0-9]+)"\s*\)' | Select-Object -First 1
            if (-not $versionMatch) { throw 'Could not read CORVUS_VERSION from CMakeLists.txt' }
            $version = $versionMatch.Matches[0].Groups[1].Value
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          & $iscc "/DAppVersion=$version" "/DStageDir=$((Resolve-Path stage).Path)" packaging\windows\corvus.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

          Get-ChildItem dist | Format-Table Name, Length

      # Install the real setup silently and check that qrencode.exe and corvus-cli.exe really end
      # up in the install folder and run from there.
      - name: Test setup installs qrencode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $setup = (Resolve-Path 'dist\corvus-windows-x64-setup.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'corvus-install-test'
          $log = Join-Path $env:RUNNER_TEMP 'corvus-setup.log'

          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir", "/LOG=$log")
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 50 }
            throw "Setup exited with code $($p.ExitCode)"
          }

          foreach ($f in 'corvus.exe', 'qrencode.exe', 'corvus-cli\corvus-cli.exe', 'corvus-cli\libcrypto-3-x64.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f was not installed by the setup" }
          }

          & (Join-Path $dir 'qrencode.exe') -V
          if ($LASTEXITCODE -ne 0) { throw 'Installed qrencode.exe does not run' }

          & (Join-Path $dir 'corvus-cli\corvus-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed corvus-cli.exe does not run' }

          $unins = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          if ($unins) { Start-Process -FilePath $unins.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait }

      - name: Verify artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $f = 'dist\corvus-windows-x64-setup.exe'
          if (-not (Test-Path $f) -or (Get-Item $f).Length -eq 0) { throw "$f is missing or empty" }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corvus-windows-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------
  # Project website + signed Flatpak repository on GitHub Pages
  # (automatic updates via `flatpak update`)
  # Enabled with the repository variable FLATPAK_REPO_PUBLISH=true
  # ------------------------------------------------------
  flatpak-repo:
    name: Publish website and Flatpak repository (GitHub Pages)
    if: vars.FLATPAK_REPO_PUBLISH == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs:
      - flatpak
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FLATPAK_APP_ID: io.github.ada_h00k.Corvus
      FLATPAK_BRANCH: stable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Download OSTree repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: flatpak-repo-${{ github.sha }}
          path: .

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg

      - name: Import signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::The secret FLATPAK_GPG_PRIVATE_KEY is not set (see the setup guide)."
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import <<< "$GPG_PRIVATE_KEY"

          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          if [ -z "$fpr" ]; then
            echo "::error::No secret key found in FLATPAK_GPG_PRIVATE_KEY."
            exit 1
          fi

          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_FPR=$fpr" >> "$GITHUB_ENV"
          echo "Signing with key $fpr"

      # Every commit of the repository (app, locale and debug refs) gets signed, then the
      # summary. Flatpak refuses unsigned commits from a remote that has a GPG key.
      - name: Sign repository
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p site/repo
          tar -xf flatpak-repo.tar -C site/repo

          for ref in $(ostree refs --repo=site/repo); do
            commit="$(ostree rev-parse --repo=site/repo "$ref")"
            ostree gpg-sign --repo=site/repo --gpg-homedir="$GNUPGHOME" "$commit" "$GPG_FPR"
            ostree show --repo=site/repo --list-detached-metadata-keys "$commit" | grep -q ostree.gpgsigs
          done

          flatpak build-update-repo \
            --gpg-sign="$GPG_FPR" \
            --gpg-homedir="$GNUPGHOME" \
            --prune --prune-depth=1 \
            site/repo

          test -s site/repo/summary
          test -s site/repo/summary.sig
          ostree refs --repo=site/repo

      - name: Create remote description files and website
        shell: bash
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          base="${BASE_URL%/}"
          gpgkey="$(gpg --export "$GPG_FPR" | base64 -w0)"

          cat > site/corvus.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Corvus
          Url=$base/repo/
          Homepage=$REPO_URL
          Comment=Desktop client for Signal
          Description=Corvus, a Qt 6 desktop client for Signal (includes corvus-cli)
          GPGKey=$gpgkey
          EOF

          cat > site/$FLATPAK_APP_ID.flatpakref <<EOF
          [Flatpak Ref]
          Title=Corvus
          Name=$FLATPAK_APP_ID
          Branch=$FLATPAK_BRANCH
          Url=$base/repo/
          SuggestRemoteName=corvus
          IsRuntime=false
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          GPGKey=$gpgkey
          EOF

          # Project website (docs/website/index.html); the placeholders become the real URL/app ID
          mkdir -p site/screenshots
          cp docs/screenshots/*.png site/screenshots/
          cp packaging/corvus.svg site/corvus.svg
          sed -e "s|__BASE_URL__|$base|g" -e "s|__APP_ID__|$FLATPAK_APP_ID|g" \
            docs/website/index.html > site/index.html
          ! grep -q '__BASE_URL__\|__APP_ID__' site/index.html

          ls -lh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # ------------------------------------------------------
  # Publish a GitHub Release only for version tags (all artifacts together)
  # ------------------------------------------------------
  release:
    if: github.ref_type == 'tag'
    name: Publish release
    runs-on: ubuntu-24.04
    needs:
      - build
      - arch-package
      - flatpak
      - appimage
      - macos-app
      - macos-qt-app
      - windows-app
    # The only job that needs write access: it creates the GitHub release and
    # publishes the FlatPark bundle.
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: corvus-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Regenerate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS

          cat SHA256SUMS
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Corvus ${{ github.ref_name }}
          body: |
            Automatic Linux x86_64 (including Flatpak and AppImage), Windows x86_64 and macOS (Apple silicon) builds.
            macOS includes both the native SwiftUI app and the Qt app.

            Version: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`

            Files:
            - `corvus-linux-x86_64-installer.tar.gz` — executable, per-user installer, and menu resources
            - `corvus-<version>-1-x86_64.pkg.tar.zst` — Arch Linux package (`sudo pacman -U <file>`)
            - `corvus-linux-x86_64.flatpak` — sandboxed Flatpak bundle incl. corvus-cli (`flatpak install --user ./corvus-linux-x86_64.flatpak`)
            - `corvus-linux-x86_64.AppImage` — AppImage incl. corvus-cli, qrencode, libhunspell and dictionaries (`chmod +x corvus-linux-x86_64.AppImage && ./corvus-linux-x86_64.AppImage`); updates itself through AppImageUpdate
            - `corvus-linux-x86_64.AppImage.zsync` — update information for the AppImage (used by AppImageUpdate; not meant for manual download)
            - `corvus-linux-x86_64-flatpark.tar.gz` — self-contained app tree (Flatpak build output incl. corvus-cli, qrencode and libraries) used by the FlatPark package; not meant for manual installation
            - `corvus-macos-arm64.zip` — native SwiftUI app for Apple silicon, macOS 14 or newer
            - `corvus-qt-macos-arm64.zip` — Qt app for Apple silicon, including deployed Qt dependencies
            - `corvus-windows-x64-setup.exe` — Windows setup (English), includes corvus-cli
            - `SHA256SUMS` — SHA-256 checksums for all files above

            `corvus-cli` must be installed separately on Linux (installer, Arch), and on macOS (`brew install --cask corvus-cli`). The Flatpak, the AppImage and the Windows builds include corvus-cli and need nothing else.
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/corvus-linux-x86_64-installer.tar.gz
            dist/*.pkg.tar.zst
            dist/corvus-linux-x86_64.flatpak
            dist/corvus-linux-x86_64.AppImage
            dist/corvus-linux-x86_64.AppImage.zsync
            dist/corvus-linux-x86_64-flatpark.tar.gz
            dist/corvus-macos-arm64.zip
            dist/corvus-qt-macos-arm64.zip
            dist/corvus-windows-x64-setup.exe
            dist/SHA256SUMS

      # The release above is created with GITHUB_TOKEN, so GitHub does not
      # emit a release:published event for a separate workflow. Notify FlatPark
      # here, after the release exists, and never fail the GitHub release if
      # the FlatPark webhook is temporarily unavailable.
      - name: Publish to FlatPark
        uses: flatpark/publish-action@b67fca1b80b095541bc011967e0a35292bed14d8 # v1
        continue-on-error: true
        with:
          app-id: io.github.ada_h00k.Corvus
          tag: ${{ github.ref_name }}
