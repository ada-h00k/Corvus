name: Build Linux Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.12"

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # System dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            file \
            curl \
            wget \
            ca-certificates \
            fuse3 \
            libfuse2t64 \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-util1 \
            libx11-xcb1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libegl1 \
            libopengl0 \
            libqrencode-dev

      # --------------------------------------------------
      # Qt
      # --------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure Qt environment
        shell: bash
        run: |
          set -euo pipefail

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

          QMAKE_PATH="$(find "$QT_ROOT_DIR" \
            -type f -name qmake -print -quit)"

          if [ -z "$QMAKE_PATH" ]; then
            echo "::error::qmake not found in $QT_ROOT_DIR"
            exit 1
          fi

          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"
          "$QMAKE_PATH" --version

      # --------------------------------------------------
      # Rust
      # --------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail

          cargo test \
            --release \
            --locked \
            --manifest-path history-store/Cargo.toml

      # --------------------------------------------------
      # CMake
      # --------------------------------------------------
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      # --------------------------------------------------
      # Locate application executable
      # --------------------------------------------------
      - name: Locate executable
        shell: bash
        run: |
          set -euo pipefail

          find build -maxdepth 4 -type f -executable -print

          BINARY=""

          for candidate in \
            build/signal-cli-qt \
            build/bin/signal-cli-qt \
            build/signal-cli-Qt \
            build/bin/signal-cli-Qt
          do
            if [ -f "$candidate" ]; then
              BINARY="$candidate"
              break
            fi
          done

          if [ -z "$BINARY" ]; then
            echo "::error::Application binary not found. Check the CMake target name."
            exit 1
          fi

          echo "BINARY=$BINARY" >> "$GITHUB_ENV"
          file "$BINARY"

      # --------------------------------------------------
      # Plain Linux binary
      # --------------------------------------------------
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp "$BINARY" dist/signal-cli-qt-linux-x86_64
          chmod +x dist/signal-cli-qt-linux-x86_64

      # --------------------------------------------------
      # Validate output and checksums
      # --------------------------------------------------
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/signal-cli-qt-linux-x86_64

          file dist/signal-cli-qt-linux-x86_64

          (
            cd dist
            sha256sum \
              signal-cli-qt-linux-x86_64 \
              > SHA256SUMS
          )

          cat dist/SHA256SUMS
          ls -lh dist

      # --------------------------------------------------
      # Preserve artifacts even when a later step fails
      # --------------------------------------------------
      - name: Upload build artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signal-cli-qt-linux-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # Create a release for every commit
      # --------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Linux build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatic Linux x86_64 build.

            Commit: `${{ github.sha }}`

            Files:
            - `signal-cli-qt-linux-x86_64` — plain executable
            - `SHA256SUMS` — SHA-256 checksums

            `signal-cli` must be installed separately.
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/signal-cli-qt-linux-x86_64
            dist/SHA256SUMS
