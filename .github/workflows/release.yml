name: Build Linux Release

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: write

concurrency:
group: release-${{ github.ref }}
cancel-in-progress: false

env:
BUILD_TYPE: Release
QT_VERSION: "6.8.3"

jobs:
build:
name: Build Linux x86_64
runs-on: ubuntu-24.04

```
steps:
  # --------------------------------------------------
  # Checkout
  # --------------------------------------------------
  - name: Checkout
    uses: actions/checkout@v4

  # --------------------------------------------------
  # System dependencies
  # --------------------------------------------------
  - name: Install dependencies
    shell: bash
    run: |
      set -euxo pipefail

      sudo apt-get update
      sudo apt-get install -y \
        build-essential \
        cmake \
        ninja-build \
        pkg-config \
        file \
        curl \
        wget \
        ca-certificates \
        fuse3 \
        libfuse2t64 \
        libgl1-mesa-dev \
        libxkbcommon-dev \
        libxkbcommon-x11-0 \
        libxcb-cursor0 \
        libxcb-icccm4 \
        libxcb-image0 \
        libxcb-keysyms1 \
        libxcb-randr0 \
        libxcb-render-util0 \
        libxcb-shape0 \
        libxcb-xinerama0 \
        libxcb-xkb1 \
        libxcb-util1 \
        libx11-xcb1 \
        libdbus-1-3 \
        libfontconfig1 \
        libfreetype6 \
        libegl1 \
        libopengl0 \
        libqrencode-dev \
        plasma-integration

  # --------------------------------------------------
  # Qt
  # --------------------------------------------------
  - name: Install Qt
    uses: jurplel/install-qt-action@v4
    with:
      version: ${{ env.QT_VERSION }}
      host: linux
      target: desktop
      arch: linux_gcc_64
      cache: true

  - name: Configure Qt environment
    shell: bash
    run: |
      set -euo pipefail

      echo "QT_ROOT_DIR=$QT_ROOT_DIR"

      QMAKE_PATH="$(find "$QT_ROOT_DIR" \
        -type f -name qmake -print -quit)"

      if [ -z "$QMAKE_PATH" ]; then
        echo "::error::qmake not found in $QT_ROOT_DIR"
        exit 1
      fi

      echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"
      "$QMAKE_PATH" --version

  # --------------------------------------------------
  # Rust
  # --------------------------------------------------
  - name: Install Rust
    uses: dtolnay/rust-toolchain@stable

  - name: Run Rust tests
    shell: bash
    run: |
      set -euo pipefail

      cargo test \
        --release \
        --locked \
        --manifest-path history-store/Cargo.toml

  # --------------------------------------------------
  # CMake
  # --------------------------------------------------
  - name: Configure CMake
    shell: bash
    run: |
      set -euo pipefail

      cmake \
        -S . \
        -B build \
        -G Ninja \
        -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
        -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

  - name: Build
    run: cmake --build build --parallel

  # --------------------------------------------------
  # Locate application executable
  # --------------------------------------------------
  - name: Locate executable
    shell: bash
    run: |
      set -euo pipefail

      find build -maxdepth 4 -type f -executable -print

      BINARY=""

      for candidate in \
        build/signal-cli-qt \
        build/bin/signal-cli-qt \
        build/signal-cli-Qt \
        build/bin/signal-cli-Qt
      do
        if [ -f "$candidate" ]; then
          BINARY="$candidate"
          break
        fi
      done

      if [ -z "$BINARY" ]; then
        echo "::error::Application binary not found. Check the CMake target name."
        exit 1
      fi

      echo "BINARY=$BINARY" >> "$GITHUB_ENV"
      file "$BINARY"

  # --------------------------------------------------
  # Plain Linux binary
  # --------------------------------------------------
  - name: Package binary
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p dist

      cp "$BINARY" dist/signal-cli-qt-linux-x86_64
      chmod +x dist/signal-cli-qt-linux-x86_64

  # --------------------------------------------------
  # Download linuxdeploy tools
  # --------------------------------------------------
  - name: Download linuxdeploy
    shell: bash
    run: |
      set -euo pipefail

      curl -fL --retry 5 \
        -o linuxdeploy-x86_64.AppImage \
        https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

      curl -fL --retry 5 \
        -o linuxdeploy-plugin-qt-x86_64.AppImage \
        https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

      chmod +x \
        linuxdeploy-x86_64.AppImage \
        linuxdeploy-plugin-qt-x86_64.AppImage

      echo "LINUXDEPLOY_PLUGIN_QT=linuxdeploy-plugin-qt-x86_64.AppImage" >> "$GITHUB_ENV"

  # --------------------------------------------------
  # Prepare AppDir, icon, desktop entry and KDE hook
  # --------------------------------------------------
  - name: Prepare AppDir
    shell: bash
    run: |
      set -euo pipefail

      rm -rf AppDir

      mkdir -p \
        AppDir/usr/bin \
        AppDir/usr/share/applications \
        AppDir/usr/share/icons/hicolor/scalable/apps \
        AppDir/apprun-hooks

      install -m 755 "$BINARY" AppDir/usr/bin/signal-cli-qt

      cat > AppDir/usr/share/icons/hicolor/scalable/apps/signal-cli-qt.svg <<'SVG'
      <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
        <rect x="8" y="8" width="240" height="240" rx="48" fill="#ffffff" stroke="#222222" stroke-width="8"/>
        <circle cx="128" cy="116" r="64" fill="none" stroke="#222222" stroke-width="12"/>
        <path d="M92 188 L128 224 L164 188" fill="none" stroke="#222222" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="106" cy="116" r="8" fill="#222222"/>
        <circle cx="150" cy="116" r="8" fill="#222222"/>
      </svg>
      SVG

      cat > AppDir/usr/share/applications/signal-cli-qt.desktop <<'DESKTOP'
      [Desktop Entry]
      Type=Application
      Name=signal-cli Qt
      Comment=Qt GUI for signal-cli
      Exec=signal-cli-qt
      Icon=signal-cli-qt
      Terminal=false
      Categories=Network;InstantMessaging;
      StartupNotify=true
      DESKTOP

      cp \
        AppDir/usr/share/icons/hicolor/scalable/apps/signal-cli-qt.svg \
        AppDir/signal-cli-qt.svg

      # Do not force KDE integration outside a Plasma session.
      # The host KDE plugin is used only if it is available and
      # compatible with the Qt libraries loaded by the AppImage.
      cat > AppDir/apprun-hooks/10-kde-theme.sh <<'HOOK'
      #!/bin/bash

      case "${XDG_CURRENT_DESKTOP:-}" in
          *KDE*|*Kde*|*kde*)
              export QT_QPA_PLATFORMTHEME="${QT_QPA_PLATFORMTHEME:-kde}"
              ;;
      esac
      HOOK

      chmod 755 AppDir/apprun-hooks/10-kde-theme.sh

  # --------------------------------------------------
  # Build AppImage
  # --------------------------------------------------
  - name: Build AppImage
    shell: bash
    run: |
      set -euo pipefail

      test -x "$QMAKE"
      "$QMAKE" --version

      export QMAKE
      export LINUXDEPLOY_PLUGIN_QT

      ./linuxdeploy-x86_64.AppImage \
        --appdir AppDir \
        --desktop-file AppDir/usr/share/applications/signal-cli-qt.desktop \
        --plugin qt \
        --output appimage

      APPIMAGE="$(find . -maxdepth 1 -type f \
        -name '*.AppImage' \
        ! -name 'linuxdeploy-*' \
        -print -quit)"

      if [ -z "$APPIMAGE" ]; then
        echo "::error::No AppImage was generated"
        exit 1
      fi

      mv "$APPIMAGE" dist/signal-cli-qt-x86_64.AppImage
      chmod +x dist/signal-cli-qt-x86_64.AppImage

  # --------------------------------------------------
  # Verify artifacts and checksums
  # --------------------------------------------------
  - name: Verify artifacts
    shell: bash
    run: |
      set -euo pipefail

      test -s dist/signal-cli-qt-linux-x86_64
      test -s dist/signal-cli-qt-x86_64.AppImage

      file dist/signal-cli-qt-linux-x86_64
      file dist/signal-cli-qt-x86_64.AppImage

      (
        cd dist
        sha256sum \
          signal-cli-qt-linux-x86_64 \
          signal-cli-qt-x86_64.AppImage \
          > SHA256SUMS
      )

      cat dist/SHA256SUMS
      ls -lh dist

  # --------------------------------------------------
  # Preserve artifacts even when a later step fails
  # --------------------------------------------------
  - name: Upload build artifacts
    if: always() && hashFiles('dist/*') != ''
    uses: actions/upload-artifact@v4
    with:
      name: signal-cli-qt-linux-${{ github.sha }}
      path: dist/*
      if-no-files-found: warn
      retention-days: 14

  # --------------------------------------------------
  # Create a release for every commit
  # --------------------------------------------------
  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: build-${{ github.sha }}
      name: Linux build ${{ github.sha }}
      target_commitish: ${{ github.sha }}
      body: |
        Automatic Linux x86_64 build.

        Commit: `${{ github.sha }}`

        Files:
        - `signal-cli-qt-linux-x86_64` — plain executable
        - `signal-cli-qt-x86_64.AppImage` — AppImage
        - `SHA256SUMS` — SHA-256 checksums

        `signal-cli` must be installed separately.
      draft: false
      prerelease: false
      make_latest: true
      fail_on_unmatched_files: true
      files: |
        dist/signal-cli-qt-linux-x86_64
        dist/signal-cli-qt-x86_64.AppImage
        dist/SHA256SUMS
