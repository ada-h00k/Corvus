name: Update Flatpak dependencies

# Dependabot has no "flatpak" package ecosystem, so this workflow runs the
# same tool Flathub itself uses (flatpak-external-data-checker). It scans the
# x-checker-data annotations in the Flatpak manifest (git tags of libsecret,
# qtkeychain, libqrencode; signal-cli GitHub releases incl. sha256) and opens
# one pull request per detected update batch.
#
# Not covered, on purpose:
#   - runtime/sdk (org.kde.Platform '6.11') and org.freedesktop.Platform.ffmpeg-full
#     '25.08': runtime bumps are major version upgrades and belong to a reviewed
#     manual change. Keep them in sync manually.
#   - cargo crates: covered by the "cargo" ecosystem in .github/dependabot.yml;
#     release.yml regenerates cargo-sources.json from Cargo.lock at build time.
#     The manifest references that file, and the checker parses every source
#     file it references - but it is gitignored, so the step below first
#     writes an empty placeholder (which the checker handles fine).
#
# Note: PRs opened here are NOT build-tested (release.yml has no pull_request
# trigger). Merging is safe in principle, but check that the next push build's
# flatpak job stays green before cutting a release.
#
# Signed-commit rulesets: pushes made as github-actions[bot] (the built-in
# GITHUB_TOKEN identity) can never satisfy a "commits must have verified
# signatures" ruleset, and that bot cannot be added to a ruleset bypass list
# (only apps explicitly installed on the repository appear there). To make
# pushes work, set the repo secret FEDC_TOKEN to a token belonging to a
# bypass actor - e.g. a fine-grained PAT of the repo admin, or a custom
# GitHub App installation token that is on the bypass list. Falls back to
# the default GITHUB_TOKEN when the secret is not set.

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC
    - cron: "0 4 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-flatpak
  cancel-in-progress: false

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create placeholder cargo-sources.json
        run: |
          # cargo-sources.json is generated by release.yml from Cargo.lock at
          # build time and is deliberately gitignored. The external data
          # checker opens every source file referenced by the manifest and
          # would fail with FileNotFoundError. An empty source list is valid
          # and contains nothing to check - crate updates are Dependabot's
          # job. Being gitignored, the placeholder can never leak into a PR.
          echo '[]' > packaging/flatpak/cargo-sources.json

      - name: Check for external data updates
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # see header comment: token of a bypass actor (PAT / GitHub App),
          # because github-actions[bot] itself cannot be bypass-listed
          GITHUB_TOKEN: ${{ secrets.FEDC_TOKEN || github.token }}
        with:
          args: --update --never-fork packaging/flatpak/io.github.ada_h00k.Corvus.yml
